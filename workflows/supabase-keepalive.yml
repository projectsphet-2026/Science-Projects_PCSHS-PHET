name: Supabase Keep-Alive

# กัน Supabase free-tier โดน pause (pause เมื่อไม่มี API request ~7 วัน)
# ยิง REST API ทุกวัน + เขียน heartbeat ลงตาราง activity_logs

on:
  schedule:
    - cron: '17 2 * * *'   # ทุกวัน 02:17 UTC (~09:17 เวลาไทย) — เลี่ยงเวลาเป๊ะ
  workflow_dispatch: {}      # กดรันเองได้จากแท็บ Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert heartbeat row (REST)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/activity_logs" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"event_type\":\"heartbeat\",\"page\":\"github-actions\",\"detail\":{\"run_id\":\"${GITHUB_RUN_ID}\",\"at\":\"$(date -u +%FT%TZ)\"}}")
          echo "HTTP $code"
          cat /tmp/resp.txt || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Keep-alive ล้มเหลว"; exit 1
          fi
          echo "Keep-alive สำเร็จ"
