const FaceScanner = ({ onScan, onCancel, mode = "login" }) => {
      const videoRef = useRef(null);
      const [status, setStatus] = useState("กำลังเปิดกล้อง...");
      const [scanState, setScanState] = useState("initializing");
      
      // 1. เพิ่มตัวแปร Ref เพื่อใช้เป็น "ตัวล็อก" (ค่านี้เปลี่ยนแล้วมีผลทันที ไม่ต้องรอ render ใหม่เหมือน useState)
      const isFoundRef = useRef(false);

      useEffect(() => {
        let stream = null;
        let interval = null;

        const startVideo = async () => {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              setStatus("กำลังโหลดโมเดลใบหน้า...");
              await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
                faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models'),
                faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models')
              ]);
              setScanState("scanning");
              setStatus(mode === "register" ? "กรุณามองกล้องนิ่งๆ เพื่อลงทะเบียน" : "กรุณามองกล้องเพื่อเข้าสู่ระบบ");
              detectFace();
            }
          } catch (err) { setStatus("ไม่สามารถเปิดกล้องได้: " + err.message); }
        };

        const detectFace = async () => {
          if (!videoRef.current) return;
          
          interval = setInterval(async () => {
             // 2. เช็คตัวล็อกก่อนเลย: ถ้าเคยเจอแล้ว ให้ข้ามรอบนี้ไปเลย ไม่ต้องประมวลผลต่อ
             if (isFoundRef.current) return;
             if (!videoRef.current || videoRef.current.paused || videoRef.current.ended) return;

             const detections = await faceapi.detectSingleFace(videoRef.current, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
             
             if (detections) {
               // 3. เจอหน้าแล้ว! รีบเช็คอีกทีว่าโดนล็อกไปหรือยัง (Double Check)
               if (isFoundRef.current) return;

               // 4. สั่งล็อกทันที! รอบถัดไปจะเข้ามาไม่ได้แล้ว
               isFoundRef.current = true;
               
               clearInterval(interval); 
               setScanState("processing"); 
               setStatus("พบใบหน้า! กำลังตรวจสอบข้อมูล...");
               
               const descriptorArray = Array.from(detections.descriptor);
               await onScan(descriptorArray); 
             }
          }, 500);
        };

        startVideo();
        
        // Cleanup: เมื่อปิด Component ให้หยุดทุกอย่าง
        return () => { 
            if (stream) stream.getTracks().forEach(track => track.stop()); 
            if (interval) clearInterval(interval); 
            isFoundRef.current = false; // Reset ตัวล็อก
        };
      }, []);

      return (
        <div className="fixed inset-0 bg-black/90 z-[60] flex flex-col items-center justify-center p-4">
          <div className="w-full max-w-xs bg-white rounded-2xl overflow-hidden shadow-2xl relative">
            <div className="relative h-64 bg-gray-900 scan-container">
                <video ref={videoRef} autoPlay muted playsInline className="w-full h-full object-cover"></video>
                {scanState === "scanning" && (<div className="scan-line"></div>)}
                {scanState === "processing" && (
                    <div className="absolute inset-0 bg-black/60 flex flex-col items-center justify-center text-white z-20">
                        <Icons.Loader2 className="spin mb-2" size={48} />
                        <span className="font-bold">กำลังตรวจสอบ...</span>
                    </div>
                )}
            </div>
            <div className="p-4 text-center">
              <h3 className="font-bold text-gray-800 text-lg mb-1">{mode === "register" ? "ลงทะเบียนใบหน้า" : "ยืนยันตัวตน"}</h3>
              <p className="text-sm text-gray-500 mb-4">{status}</p>
              {scanState !== "processing" && (<button onClick={onCancel} className="text-gray-400 text-sm hover:text-gray-600 underline">ยกเลิก</button>)}
            </div>
          </div>
        </div>
      );
    };

    
// --- [UPDATED V.6] PROJECT IMPORT (Smart Match: Fuzzy + Space Fix) ---
    
    // 1. Helper Function: คำนวณความต่างของคำ (Levenshtein Distance)
    // คืนค่าจำนวนตัวอักษรที่ต้องแก้เพื่อให้คำสองคำเหมือนกัน (ยิ่งน้อยยิ่งเหมือน)
    const levenshtein = (a, b) => {
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1, // substitution
                        Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1) // insertion/deletion
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    };

    const ProjectImport = ({ onBack }) => {
        const [step, setStep] = useState('upload'); 
        const [helperData, setHelperData] = useState({ users: [], existingKeys: [] });
        const [importedRows, setImportedRows] = useState([]);
        const [editForm, setEditForm] = useState(null);
        const [editingIndex, setEditingIndex] = useState(-1);

        useEffect(() => {
            let isMounted = true;
            const init = async () => {
                try {
                    const data = await api.getImportData();
                    if (isMounted) setHelperData(data);
                } catch (e) { console.error("Load import data failed", e); }
            };
            init();
            return () => { isMounted = false; };
        }, []);

        const downloadTemplate = () => {
            const headers = [["pj_ID (จำเป็น)", "pj_year", "pj_name", "pj_category (สาขาวิชา)", "pj_education_level", "pj_member (username หรือ ชื่อ)", "pj_advisor (username หรือ ชื่อ)"]];
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(headers);
            XLSX.utils.book_append_sheet(wb, ws, "Template");
            XLSX.writeFile(wb, "Project_Import_Template.xlsx");
        };

        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const bstr = evt.target.result;
                const wb = XLSX.read(bstr, { type: 'binary' });
                const wsname = wb.SheetNames[0];
                const ws = wb.Sheets[wsname];
                const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
                processData(data);
            };
            reader.readAsBinaryString(file);
        };

        const processData = (rows) => {
            const cleanData = [];
            const validCategories = ['เคมี', 'ชีววิทยา', 'ฟิสิกส์', 'นวัตกรรม', 'คอมพิวเตอร์', 'คณิตศาสตร์'];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || (!row[0] && !row[2])) continue; 

                const pID = row[0] !== undefined ? String(row[0]).trim() : "";
                const pYear = row[1] !== undefined ? String(row[1]).trim() : String(new Date().getFullYear() + 543);
                const pName = row[2] !== undefined ? String(row[2]).trim() : "ไม่ระบุชื่อโครงงาน";
                const pCat = row[3] !== undefined ? String(row[3]).trim() : ""; 
                const pLevel = row[4] !== undefined ? String(row[4]).trim() : "มัธยมศึกษาตอนปลาย";
                
                const rawMembers = row[5] !== undefined ? String(row[5]) : "";
                const rawAdvisors = row[6] !== undefined ? String(row[6]) : "";

                const rowObj = {
                    pj_ID: pID,
                    pj_year: pYear,
                    pj_name: pName,
                    pj_category: pCat,
                    pj_education_level: pLevel,
                    pj_member: [],
                    pj_advisor: [],
                    _originalRowIndex: i + 1,
                    _errors: {} 
                };

                // --- Validation ---

                // 1. Check ID
                if (!pID) {
                    rowObj._errors.pj_ID = "ขาดรหัส";
                } else {
                    const key = `${pID}_${pYear}`;
                    if (helperData.existingKeys.includes(key)) rowObj._errors.pj_ID = "รหัสซ้ำในระบบ";
                }

                // 2. Check Category
                if (!validCategories.includes(pCat)) rowObj._errors.pj_category = "สาขาไม่ถูกต้อง";

                // 3. Helper Check User (Smart Match Logic)
                const checkUsers = (rawString, fieldName) => {
                    if (!rawString) return [];
                    
                    // แยก comma และลบช่องว่างหัวท้าย
                    const inputs = rawString.split(',').map(s => s.trim()).filter(s => s !== "");
                    
                    const validUsernames = [];
                    const invalidNames = [];

                    inputs.forEach(input => {
                        // --- เทคนิคที่ 1: Normalize Spaces (แก้ปัญหาวรรคเกิน) ---
                        // เปลี่ยน 'นาย  สมชาย   ใจดี' -> 'นาย สมชาย ใจดี'
                        const cleanInput = input.replace(/\s+/g, ' ');

                        // ค้นหาใน DB
                        const matchedUser = helperData.users.find(u => {
                            const dbUsername = String(u.username);
                            const dbName = String(u.name).replace(/\s+/g, ' '); // Normalize ชื่อใน DB ด้วยเผื่อไว้

                            // A. ตรวจสอบ Username (รหัส) แบบตรงเป๊ะ
                            if (dbUsername === cleanInput) return true;

                            // B. ตรวจสอบชื่อ แบบตรงเป๊ะ (หลังจากจัดวรรคแล้ว)
                            if (dbName === cleanInput) return true;

                            // C. --- เทคนิคที่ 2: Fuzzy Match (แก้ปัญหาพิมพ์ผิด 2-3 ตัว) ---
                            // เช็คเฉพาะถ้า Input ยาวพอสมควร (มากกว่า 3 ตัวอักษร) เพื่อป้องกันการมั่วคำสั้นๆ
                            if (cleanInput.length > 3) {
                                const dist = levenshtein(cleanInput, dbName);
                                // ยอมให้ผิดได้ไม่เกิน 3 ตัวอักษร (ปรับเลขนี้ได้ตามความโหด)
                                if (dist <= 3) return true; 
                            }
                            
                            return false;
                        });
                        
                        if (matchedUser) {
                            validUsernames.push(matchedUser.username);
                        } else {
                            invalidNames.push(input);
                        }
                    });
                    
                    if (invalidNames.length > 0) {
                        rowObj._errors[fieldName] = invalidNames; 
                    }
                    return validUsernames;
                };

                rowObj.pj_member = checkUsers(rawMembers, 'pj_member');
                rowObj.pj_advisor = checkUsers(rawAdvisors, 'pj_advisor');

                cleanData.push(rowObj);
            }
            
            cleanData.forEach((row, idx) => {
                if(row.pj_ID) {
                    const isDup = cleanData.some((r, i) => i !== idx && r.pj_ID === row.pj_ID && r.pj_year === row.pj_year);
                    if(isDup) row._errors.pj_ID = "รหัสซ้ำกันในไฟล์";
                }
            });

            setImportedRows(cleanData);
            setStep('table_view'); 
        };

        const handleOpenEdit = (index) => {
            setEditingIndex(index);
            setEditForm({ ...importedRows[index] });
        };

        const handleSaveEdit = () => {
            const form = { ...editForm };
            const errors = {};
            let isValid = true;
            const validCategories = ['เคมี', 'ชีววิทยา', 'ฟิสิกส์', 'นวัตกรรม', 'คอมพิวเตอร์', 'คณิตศาสตร์'];

            if (!form.pj_ID) { errors.pj_ID = "ขาดรหัส"; isValid = false; }
            else {
                 const orgRow = importedRows[editingIndex];
                 if(form.pj_ID !== orgRow.pj_ID || form.pj_year !== orgRow.pj_year) {
                     const key = `${form.pj_ID}_${form.pj_year}`;
                     if (helperData.existingKeys.includes(key)) { errors.pj_ID = "รหัสซ้ำในระบบ"; isValid = false; }
                     const isDup = importedRows.some((r, i) => i !== editingIndex && r.pj_ID === form.pj_ID && r.pj_year === form.pj_year);
                     if(isDup) { errors.pj_ID = "รหัสซ้ำกันในไฟล์"; isValid = false; }
                 }
            }

            if (!validCategories.includes(form.pj_category)) { errors.pj_category = "สาขาผิด"; isValid = false; }
            
            form._errors = { ...errors };

            const newRows = [...importedRows];
            newRows[editingIndex] = form;
            setImportedRows(newRows);
            setEditForm(null);
        };

        const handleDeleteRow = () => {
            const newRows = importedRows.filter((_, i) => i !== editingIndex);
            setImportedRows(newRows);
            setEditForm(null);
            if(newRows.length === 0) setStep('upload');
        };

        const totalErrors = importedRows.filter(r => Object.keys(r._errors).length > 0).length;

        const handleFinalSubmit = async () => {
            if (totalErrors > 0) return;
            setStep('saving');
            try {
                const res = await api.batchImport(importedRows);
                if (res.success) {
                    await Swal.fire('สำเร็จ', `นำเข้าข้อมูล ${res.count} รายการเรียบร้อย`, 'success');
                    onBack();
                } else {
                    Swal.fire('Error', res.message, 'error');
                    setStep('table_view');
                }
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
                setStep('table_view');
            }
        };

        return (
            <div className="animate-fadeIn p-4 bg-white rounded-2xl shadow-sm border border-gray-100 min-h-[400px] flex flex-col h-full">
                <div className="flex items-center gap-2 mb-4 border-b pb-4 shrink-0">
                    <button onClick={onBack} className="p-1 rounded-full hover:bg-gray-200 text-gray-500"><Icons.ChevronRight className="rotate-180" size={24} /></button>
                    <div>
                        <h2 className="text-xl font-bold text-gray-800">นำเข้าข้อมูลโครงงาน</h2>
                        <p className="text-xs text-gray-500">ตรวจสอบและแก้ไขข้อมูลก่อนนำเข้า</p>
                    </div>
                </div>

                <div className="flex-1 overflow-y-auto min-h-0 relative">
                    {step === 'upload' && (
                        <div className="flex flex-col items-center justify-center py-10 space-y-6 h-full">
                            <button onClick={downloadTemplate} className="text-blue-600 text-sm font-bold flex items-center gap-2 hover:underline">
                                <Icons.FileText size={16} /> ดาวน์โหลดไฟล์ Template (.xlsx)
                            </button>
                            <div className="w-full max-w-md p-8 border-2 border-dashed border-blue-200 bg-blue-50 rounded-2xl text-center hover:bg-blue-100 transition cursor-pointer relative">
                                <Icons.Folder size={48} className="mx-auto text-blue-400 mb-2" />
                                <p className="text-gray-600 font-bold">คลิกเพื่อเลือกไฟล์</p>
                                <input type="file" onChange={handleFileUpload} accept=".xlsx, .xls, .csv" className="absolute inset-0 opacity-0 cursor-pointer" />
                            </div>
                        </div>
                    )}

                    {step === 'table_view' && (
                        <div className="space-y-4">
                            <div className={`p-4 rounded-xl border flex items-center justify-between ${totalErrors > 0 ? 'bg-red-50 border-red-100' : 'bg-green-50 border-green-100'}`}>
                                <div className="flex items-center gap-3">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center ${totalErrors > 0 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>
                                        {totalErrors > 0 ? <Icons.AlertCircle size={20} /> : <Icons.ClipboardCheck size={20} />}
                                    </div>
                                    <div>
                                        <h3 className={`font-bold ${totalErrors > 0 ? 'text-red-800' : 'text-green-800'}`}>

    // Component เลือก User หลายคน (สำหรับสมาชิกและที่ปรึกษา)
    const MultiUserSelect = ({ label, users, selectedUsernames, onChange, roleFilter }) => {
        const [search, setSearch] = useState("");
        const [showList, setShowList] = useState(false);

        // กรอง User ตาม Role และคำค้นหา
        const filteredUsers = users.filter(u => 
            (roleFilter ? u.role === roleFilter : true) &&
            !selectedUsernames.includes(u.username) &&
            (u.username.toLowerCase().includes(search.toLowerCase()) || u.name.toLowerCase().includes(search.toLowerCase()))
        );

        const handleAdd = (username) => {
            onChange([...selectedUsernames, username]);
            setSearch("");
            setShowList(false);
        };

        const handleRemove = (usernameToRemove) => {
            onChange(selectedUsernames.filter(u => u !== usernameToRemove));
        };

        const getDisplayName = (username) => {
            const u = users.find(user => user.username === username);
            return u ? u.name : username;
        };

        return (
            <div className="mb-4">
                <label className="text-xs text-gray-500 font-semibold ml-1">{label}</label>
                <div className="relative">
                    <input 
                        type="text" 
                        value={search}
                        onChange={(e) => { setSearch(e.target.value); setShowList(true); }}
                        onFocus={() => setShowList(true)}
                        placeholder={`ค้นหา${label}...`}
                        className="w-full p-2.5 rounded-xl border bg-white border-blue-300 focus:ring-2 focus:ring-blue-200 mb-2"
                    />
                    {showList && search && (
                        <div className="absolute z-10 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-40 overflow-y-auto">
                            {filteredUsers.length > 0 ? filteredUsers.map(u => (
                                <div key={u.username} onClick={() => handleAdd(u.username)} className="p-2 hover:bg-blue-50 cursor-pointer text-sm border-b border-gray-50 flex justify-between">
                                    <span>{u.name}</span>
                                    <span className="text-xs text-gray-400">({u.username})</span>
                                </div>
                            )) : <div className="p-2 text-sm text-gray-400 text-center">ไม่พบข้อมูล</div>}
                        </div>
                    )}
                </div>
                {/* Selected Tags */}
                <div className="flex flex-wrap gap-2">
                    {selectedUsernames.map(username => (
                        <span key={username} className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full flex items-center gap-1">
                            {getDisplayName(username)}
                            <button onClick={() => handleRemove(username)} className="hover:text-red-500 font-bold">×</button>
                        </span>
                    ))}
                </div>
                {/* Hidden Overlay to close list */}
                {showList && <div className="fixed inset-0 z-0" onClick={() => setShowList(false)}></div>}
            </div>
        );
    };

// Component จัดการโครงงาน (Create Form) - ปรับปรุงสาขาวิชา

    // ฟังก์ชันช่วยแปลง JSON String กลับเป็น Array
    const safeParse = (str) => {
        try {
            // ถ้าเป็น Array อยู่แล้วก็ใช้เลย
            if (Array.isArray(str)) return str;
            // ถ้าเป็น JSON String ให้แปลง
            if (str && str.startsWith('[')) return JSON.parse(str);
            // ถ้าเป็น string ธรรมดา (กรณีเก่า) ให้ wrap array
            return str ? [str] : [];
        } catch (e) {
            return [];
        }
    };
    
    // กำหนดค่าเริ่มต้น: ถ้ามี initialData ให้ใช้ค่านั้น ถ้าไม่มีให้เป็นค่าว่าง

            if (initialData) {

// --- UTILS: คำนวณปีการศึกษา ---
    const getCurrentAcademicYear = () => {
        const now = new Date();
        const year = now.getFullYear() + 543; // ปี พ.ศ.
        const month = now.getMonth() + 1; // เดือน (1-12)
        const day = now.getDate();

        // เกณฑ์: 1 พฤษภาคม 2568 - 30 มีนาคม 2569 คือ ปีการศึกษา 2568
        // แปลว่า: 
        // - ถ้าเดือน 5 (พ.ค.) ถึง 12 (ธ.ค.) => ปีการศึกษา = ปีปัจจุบัน
        // - ถ้าเดือน 1 (ม.ค.) ถึง 3 (มี.ค.) => ปีการศึกษา = ปีปัจจุบัน - 1
        // - เดือน 4 (เม.ย.) ปกติเป็นปิดเทอม แต่มักจะนับรวมกับปีการศึกษาเดิม หรือปีใหม่ก็ได้ 
        //   (ในที่นี้ขอตัดที่ 1 พ.ค. ดังนั้น ม.ค.-เม.ย. ให้เป็นปีเก่า)

        if (month >= 5) {
            return year;
        } else {
            return year - 1;
        }
    };

    const MultiProjectSelect = ({ projects, selectedIds, onChange }) => {
        const [search, setSearch] = useState("");
        
        const toggleProject = (pj_ID) => {
            if (selectedIds.includes(pj_ID)) {
                onChange(selectedIds.filter(id => id !== pj_ID));
            } else {
                onChange([...selectedIds, pj_ID]);
            }
        };

        const filtered = projects.filter(p => 
            p.pj_name.toLowerCase().includes(search.toLowerCase()) || 
            p.pj_ID.toLowerCase().includes(search.toLowerCase())
        );

        return (
            <div>
                <input type="text" placeholder="ค้นหาโครงงาน..." value={search} onChange={e=>setSearch(e.target.value)} className="w-full p-2 border rounded-lg mb-2 text-sm"/>

// --- SUB-COMPONENT: SubDetailInput (ส่วนที่ขาดหายไป เติมให้แล้วครับ) ---
    const SubDetailInput = ({ details, onChange }) => {
        // ป้องกัน details เป็น null/undefined
        const safeDetails = Array.isArray(details) ? details : [""];

        const handleChange = (idx, val) => {
            const newDetails = [...safeDetails];
            newDetails[idx] = val;
            onChange(newDetails);
        };

        const addDetail = () => onChange([...safeDetails, ""]);
        
        const removeDetail = (idx) => {
            const newDetails = safeDetails.filter((_, i) => i !== idx);
            onChange(newDetails.length > 0 ? newDetails : [""]); // เหลือไว้อย่างน้อย 1 ช่อง
        };

        return (
            <div className="space-y-2">
                {safeDetails.map((d, i) => (
                    <div key={i} className="flex gap-2">
                        <input 
                            type="text" 
                            value={d || ""} // Fix: ป้องกัน undefined
                            onChange={e => handleChange(i, e.target.value)}
                            placeholder={`รายละเอียดข้อย่อยที่ ${i+1}`}
                            className="flex-1 p-2 text-sm bg-white border rounded focus:outline-blue-500"
                        />
                        <button onClick={() => removeDetail(i)} className="text-gray-400 hover:text-red-500">
                            <Icons.LogOut size={16}/>
                        </button>
                    </div>
                ))}
                <button onClick={addDetail} className="text-xs text-blue-500 font-bold hover:underline">
                    + เพิ่มรายละเอียด
                </button>
            </div>
        );
    };

    // --- MAIN CRITERIA MANAGER (Original Structure with Fixes) ---

            const fetchCriteria = async () => {

                    const res = await api.getCriteria(round.id);
                    
                    if (res) {
                        setMaxScore(res.max_score_scale || 5);
                        // Fix: ตรวจสอบ items ให้แน่ใจว่าเป็น Array

                    setItems([{ id: 1, title: "", details: [""], multiplier: 1 }]);
                }
                setIsLoading(false);
            };
            fetchCriteria();
        }, [round]); // เพิ่ม dependency round

        // Helper Functions
        const addItem = () => {
            setItems([...items, { id: items.length + 1, title: "", details: [""], multiplier: 1 }]);
        };

        const updateItem = (index, field, value) => {
            const newItems = [...items];
            // Fix: ป้องกัน value เป็น undefined
            newItems[index][field] = (value === undefined || value === null) ? "" : value;
            setItems(newItems);
        };

        const removeItem = (index) => {
            const newItems = items.filter((_, i) => i !== index).map((item, i) => ({ ...item, id: i + 1 }));

        };

        const calculateTotalScore = () => {
            return items.reduce((sum, item) => sum + (maxScore * (parseFloat(item.multiplier) || 0)), 0);
        };

        const handleSave = async () => {
            setIsLoading(true);
            try {
                const payload = {
                    max_score_scale: maxScore,
                    items: items

                // ตรวจสอบว่า round.id เป็น String แน่นอน
                const res = await api.saveCriteria(String(round.id), payload);

// --- SCHEDULE MANAGER (NO ICONS VERSION) ---
    const ScheduleManager = ({ round, onBack, onGoToCommittee }) => {
        // Main State
        const [view, setView] = useState('list'); 
        const [groups, setGroups] = useState([]);
        const [isLoading, setIsLoading] = useState(false);
        
        // Filter
        const [year, setYear] = useState(new Date().getFullYear() + 543);

            exam_date: '',
            exam_time: '',
            venue: '',
            mode: 'นำเสนอหน้าชั้นเรียน'
        });

        // Load Data
        useEffect(() => {
            fetchData();
        }, [year, level]);

        const fetchData = async () => {
            setIsLoading(true);
            try {
                const groupsRes = await api.getCommittees(round.id, year, level);
                const schedulesRes = await api.getAllSchedules();

                const safeGroups = Array.isArray(groupsRes) ? groupsRes : [];
                const safeSchedules = Array.isArray(schedulesRes) ? schedulesRes : [];

                const merged = safeGroups.map(g => {
                    const sch = safeSchedules.find(s => s.group_id === g.id);
                    return { ...g, schedule: sch || null };
                });
                
                setGroups(merged);
            } catch(e) { console.error("Fetch Error:", e); setGroups([]); }
            setIsLoading(false);
        };

        const handleSelectGroup = (group) => {
            setSelectedGroup(group);
            if (group.schedule) {
                setFormData({
                    exam_date: group.schedule.exam_date || '',
                    exam_time: group.schedule.exam_time || '',
                    venue: group.schedule.venue || '',
                    mode: group.schedule.mode || 'นำเสนอหน้าชั้นเรียน'
                });
            } else {
                setFormData({ exam_date: '', exam_time: '', venue: '', mode: 'นำเสนอหน้าชั้นเรียน' });
            }
            setView('form');
        };

            if (!formData.exam_date || !formData.venue) return Swal.fire('แจ้งเตือน', 'กรุณาระบุวันที่และสถานที่', 'warning');

            setIsLoading(true);
            try {
                const payload = {
                    ...formData,
                    group_id: selectedGroup.id,
                    schedule_id: selectedGroup.schedule?.schedule_id 
                };
                
                const res = await api.saveSchedule(payload);
                
                if (res.success) {
                    Swal.fire('สำเร็จ', 'บันทึกตารางสอบเรียบร้อย', 'success');
                    setView('list');
                    fetchData(); 
                } else {
                    Swal.fire('Error', res.message, 'error');
                }

            setIsLoading(false);
        };

                <div className="p-4 border-b flex items-center gap-2 bg-slate-50 sticky top-0 z-10">

    React.useEffect(() => { loadAllRequests(); }, []);

                        api.getProjectsByAdvisor(user.username).then(myProjects => {
                            const myProjectIds = myProjects.map(p => String(p.id || p.pj_ID));
                            const filtered = data.filter(award => myProjectIds.includes(String(award.project_id)));
                            setAwardRequests(filtered);
                            resolve();
                        }).catch(() => { setAwardRequests([]); resolve(); });
                        return;

                    setAwardRequests(data);
                    resolve();

            icon: action === 'approve' ? 'warning' : 'info',

            confirmButtonColor: action === 'approve' ? '#16a34a' : '#ef4444',
            confirmButtonText: 'ยืนยัน',
            cancelButtonText: 'ยกเลิก'
        });

        if (!confirm.isConfirmed) return;
        setIsLoading(true);
        try {
            const res = await api.processRequest(reqId, action, user.username);
            if (res.success) {
                Swal.fire('สำเร็จ', res.message, 'success');

                showCancelButton: true,
                confirmButtonText: 'ส่งกลับแก้ไข',
                confirmButtonColor: '#ef4444',
                inputValidator: (value) => { if (!value) return 'กรุณาระบุเหตุผล!'; }
            });
            if (isDismissed) return;
            feedback = text;
        } else {
            const confirm = await Swal.fire({
                title: 'ยืนยันมอบรางวัล?',
                text: 'รางวัลนี้จะถูกแสดงในทำเนียบและหน้าของนักเรียน',

                confirmButtonText: 'อนุมัติ',
                confirmButtonColor: '#16a34a'

                Swal.fire('เรียบร้อย', res.message, 'success');

            fetchData();
        }, [year]);

            setIsLoading(true);
            try {
                const res = await api.getEvalSummary(round.id, year);
                setRaw(res);
                processData(res, filterText, filterStatus);
            } catch(e) { console.error(e); }
            setIsLoading(false);
        };

        const processData = (rawData, txt, status) => {
            if (!rawData) return;
            const { projects, results, committees } = rawData;

            let processed = projects.map(pj => {
                const pjResults = results.filter(r => r.project_id === pj.id);
                const commResults = pjResults.filter(r => r.role === 'committee');
                const advResults = pjResults.filter(r => r.role === 'advisor');

                // Helper คำนวณคะแนน
                const calcStats = (resList) => {
                    if (resList.length === 0) return { avg: 0, percent: 0, count: 0 };
                    const totalScore = resList.reduce((sum, r) => sum + r.score, 0);
                    const totalFull = resList.reduce((sum, r) => sum + r.full_score, 0); // ผลรวมคะแนนเต็มทั้งหมด
                    
                    const avg = (totalScore / resList.length).toFixed(2);
                    // คำนวณ % เฉลี่ย: (คะแนนรวมที่ได้ / คะแนนเต็มรวมทั้งหมด) * 100
                    const percent = totalFull > 0 ? ((totalScore / totalFull) * 100).toFixed(2) : 0;
                    
                    return { avg, percent, count: resList.length };
                };

                const commStats = calcStats(commResults);
                const advStats = calcStats(advResults);

                let commTotalNeeded = committees[pj.id] ? committees[pj.id].length : 0;
                let advTotalNeeded = pj.advisors ? pj.advisors.length : 0;

                let isCommComplete = commTotalNeeded > 0 && commStats.count >= commTotalNeeded;
                let isAdvComplete = advTotalNeeded > 0 && advStats.count >= advTotalNeeded;
                
                let isComplete = false;
                if (subMode === 'committee') isComplete = isCommComplete;
                else if (subMode === 'advisor') isComplete = isAdvComplete;
                else isComplete = isCommComplete && isAdvComplete;

                return {
                    ...pj,
                    commScore: commStats.avg,
                    commPercent: commStats.percent, // เพิ่ม %
                    advScore: advStats.avg,
                    advPercent: advStats.percent,   // เพิ่ม %
                    commCount: commStats.count,
                    commTotalNeeded,
                    advCount: advStats.count,
                    advTotalNeeded,
                    isComplete,
                    details: { commResults, advResults } 
                };
            });

            if (txt) {

                processed = processed.filter(p =>

                );

            if (status !== 'all') {
                processed = processed.filter(p => status === 'completed' ? p.isComplete : !p.isComplete);
            }

            setData(processed);
        };

                                </p>
                            </div>

                                        )}

                                );
                            })()}

            )}
        </div>
    );
};

// --- [UPDATED v4] ADMIN FILE REPOSITORY (Education Level Filter & Final Categories) ---
const AdminFileRepository = () => {
    const [data, setData] = React.useState([]);
    const [loading, setLoading] = React.useState(true);
    
    // Filters States
    const [filterYear, setFilterYear] = React.useState("ทั้งหมด");
    const [filterCategory, setFilterCategory] = React.useState("ทั้งหมด");
    // ✅ เพิ่ม State สำหรับกรองระดับชั้น
    const [filterLevelGroup, setFilterLevelGroup] = React.useState("ทั้งหมด"); 
    const [searchTerm, setSearchTerm] = React.useState("");
    
    // Modal States
    const [selectedProject, setSelectedProject] = React.useState(null);
    const [previewFile, setPreviewFile] = React.useState(null);

    // ✅ แก้ไขรายชื่อสาขาให้ครบถ้วน
    const CATEGORIES = ['เคมี', 'ชีววิทยา', 'ฟิสิกส์', 'นวัตกรรม', 'คอมพิวเตอร์', 'คณิตศาสตร์'];

    // ✅ ฟังก์ชันแก้ Invalid Date
    const formatDateSafe = (dateStr) => {
        if (!dateStr) return "-";
        // 1. ลองแปลงตรงๆ
        let d = new Date(dateStr);
        
        // 2. ถ้าเป็น Invalid Date ให้ลองแปลง format ของ GAS (yyyy-MM-dd HH:mm:ss) ให้เป็น ISO (yyyy-MM-ddTHH:mm:ss)
        if (isNaN(d.getTime())) {
            d = new Date(dateStr.replace(" ", "T"));
        }

        // 3. ถ้ายังไม่ได้อีก ให้แสดงข้อความดิบๆ ที่ส่งมาจาก Backend เลย (ดีกว่าขึ้น Invalid Date)
        if (isNaN(d.getTime())) return dateStr;

        return d.toLocaleString('th-TH', {
            day: '2-digit', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    };

    React.useEffect(() => {
        google.script.run.withSuccessHandler((res) => {
            setData(res);
            setLoading(false);
        }).getAdminFileRepositoryData();
    }, []);

    // --- Logic การกรองข้อมูล ---
    const filteredData = data.filter(item => {
        // 1. กรองปีการศึกษา
        const matchYear = filterYear === "ทั้งหมด" || String(item.year) === filterYear;
        
        // 2. กรองสาขา
        const matchCat = filterCategory === "ทั้งหมด" || item.type === filterCategory;
        
        // 3. ✅ กรองระดับชั้น (ม.ต้น / ม.ปลาย) จาก field "level"
        let matchLevel = true;
        if (filterLevelGroup !== "ทั้งหมด") {
            const lv = String(item.level || ""); // ค่าจาก Col F (เช่น "4", "4/1", "ม.4")
            const lvNum = parseInt(lv.replace(/\D/g, '')) || 0; // ดึงเฉพาะตัวเลขออกมา

            if (filterLevelGroup === "มัธยมศึกษาตอนต้น") {
                // เช็คว่าเป็น ม.1, 2, 3 หรือมีคำว่า "ต้น"
                matchLevel = (lvNum >= 1 && lvNum <= 3) || lv.includes("ต้น");
            } else if (filterLevelGroup === "มัธยมศึกษาตอนปลาย") {
                // เช็คว่าเป็น ม.4, 5, 6 หรือมีคำว่า "ปลาย"
                matchLevel = (lvNum >= 4 && lvNum <= 6) || lv.includes("ปลาย");
            }
        }
        
        // 4. ค้นหาชื่อ
        const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                            item.id.toLowerCase().includes(searchTerm.toLowerCase());
                            
        return matchYear && matchCat && matchLevel && matchSearch;
    });

    // Helper: แสดงสถานะไฟล์
    const StatusIcon = ({ files, type, icon, label }) => {
        const hasFile = files.some(f => f.type === type);
        return (
            <div className={`group relative flex items-center justify-center w-8 h-8 rounded-full border transition-all ${hasFile ? 'bg-green-100 border-green-200 text-green-600' : 'bg-gray-50 border-gray-200 text-gray-300'}`}>
                {icon}
                <span className="absolute bottom-full mb-2 hidden group-hover:block bg-gray-800 text-white text-[10px] px-2 py-1 rounded whitespace-nowrap z-10">
                    {label}: {hasFile ? 'ส่งแล้ว' : 'ขาด'}
                </span>
            </div>
        );
    };

    // ✅ แก้ไขฟังก์ชันนี้: ดึง ID จาก URL มาสร้างลิงก์ Preview (รองรับทุกไฟล์)
    const getEmbedUrl = (url) => {
        if (!url) return "";
        
        // พยายามดึง ID จาก Pattern ต่างๆ ของ Drive URL
        let fileId = "";
        const match1 = url.match(/\/d\/(.+?)\//); // หาจาก /d/xxxxx/
        const match2 = url.match(/id=(.+?)(&|$)/); // หาจาก id=xxxxx
        
        if (match1) fileId = match1[1];
        else if (match2) fileId = match2[1];

        // ถ้าได้ ID ให้ใช้ Google Drive Preview (แสดงได้ทั้ง Word, PDF, Slide)
        if (fileId) {
            return `https://drive.google.com/file/d/${fileId}/preview`;
        }

        // Fallback: ถ้าหา ID ไม่เจอจริงๆ ให้ใช้แบบเดิม
        return url.replace(/\/view.*/, '/preview');
    };

    return (
        <div className="animate-fadeIn">
            <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <Icons.Folder className="text-indigo-600" />
            คลังไฟล์โครงงาน (File Repository)
        </h2>

            {/* --- Filters Bar --- */}
            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
                {/* Search Box */}
                <div className="relative flex-1 w-full md:w-auto md:max-w-xs">
                    <Icons.Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                    <input 
                        type="text" 
                        placeholder="ค้นหาชื่อโครงงาน หรือ รหัส..." 
                        className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                        value={searchTerm}
                        onChange={e => setSearchTerm(e.target.value)}
                    />
                </div>

                {/* Dropdowns Group */}
                <div className="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                    
                    {/* Filter ระดับชั้น (ใหม่) */}
                    <select 
                        className="px-3 py-2 border border-gray-200 rounded-lg outline-none bg-gray-50 text-sm font-medium hover:bg-white focus:ring-2 focus:ring-indigo-100 transition-all" 
                        value={filterLevelGroup} 
                        onChange={e => setFilterLevelGroup(e.target.value)}
                    >
                        <option value="ทั้งหมด">ระดับชั้น: ทั้งหมด</option>
                        <option value="มัธยมศึกษาตอนต้น">มัธยมศึกษาตอนต้น</option>
                        <option value="มัธยมศึกษาตอนปลาย">มัธยมศึกษาตอนปลาย</option>
                    </select>

                    {/* Filter สาขา (อัปเดตแล้ว) */}
                    <select 
                        className="px-3 py-2 border border-gray-200 rounded-lg outline-none bg-gray-50 text-sm font-medium hover:bg-white focus:ring-2 focus:ring-indigo-100 transition-all" 
                        value={filterCategory} 
                        onChange={e => setFilterCategory(e.target.value)}
                    >
                        <option value="ทั้งหมด">สาขา: ทั้งหมด</option>
                        {CATEGORIES.map(cat => (
                            <option key={cat} value={cat}>{cat}</option>

                    </select>

                    {/* Filter ปีการศึกษา */}
                    <select 
                        className="px-3 py-2 border border-gray-200 rounded-lg outline-none bg-gray-50 text-sm font-medium hover:bg-white focus:ring-2 focus:ring-indigo-100 transition-all" 
                        value={filterYear} 
                        onChange={e => setFilterYear(e.target.value)}
                    >
                        <option value="ทั้งหมด">ปี: ทั้งหมด</option>
                        {[0,1,2].map(i => {
                            const y = String(new Date().getFullYear() + 543 - i);
                            return <option key={y} value={y}>{y}</option>;
                        })}
                    </select>
                </div>
            </div>

            {/* --- Table View --- */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                        <thead>
                            <tr className="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider border-b border-gray-200">
                                <th className="p-4 font-bold w-20">รหัส</th>
                                <th className="p-4 font-bold">ข้อมูลโครงงาน</th>
                                <th className="p-4 font-bold text-center">Checklist การส่งงาน</th>
                                <th className="p-4 font-bold text-right">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100">
                            {loading ? (
                                <tr><td colSpan="4" className="p-8 text-center text-gray-400">กำลังโหลดข้อมูล...</td></tr>
                            ) : filteredData.length === 0 ? (
                                <tr><td colSpan="4" className="p-8 text-center text-gray-400">ไม่พบข้อมูลตามเงื่อนไข</td></tr>
                            ) : (

                                    <tr key={pj.id} className="hover:bg-indigo-50/30 transition-colors">

        Image: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
        X: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
        ThumbUp: ({filled}) => <svg className={`w-5 h-5 ${filled ? 'text-blue-600 fill-current' : 'text-gray-500'}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>,
        Comment: () => <svg className="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
        Send: () => <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
        Loader: () => <svg className="animate-spin h-5 w-5 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    };

    const PostSkeleton = () => (
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-4 space-y-4">
            <div className="flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-gray-200 animate-pulse"></div><div className="space-y-2"><div className="w-32 h-4 bg-gray-200 rounded animate-pulse"></div><div className="w-20 h-3 bg-gray-200 rounded animate-pulse"></div></div></div><div className="w-full h-48 bg-gray-200 rounded-xl animate-pulse"></div>
        </div>
    );

    // --- DATA LOADING & ACTIONS ---
    React.useEffect(() => { if (view === 'list') loadFeed(); }, [view]);

    const loadFeed = async () => {
        setLoading(true);
        try {
            const [resPosts, resSocial, resUsers] = await Promise.all([api.getPosts('all'), api.getSocialData(), api.getUserNameMap()]);
            setPosts(resPosts); setSocialData(resSocial); setUserMap(resUsers);
        } catch(e) { console.error(e); }
        setLoading(false);
    };

    const handleLike = async (postId) => {
        const username = user?.username || 'admin';
        setSocialData(prev => {
            const likes = prev.likes[postId] || [];
            const isLiked = likes.includes(username);
            const newLikes = isLiked ? likes.filter(u => u !== username) : [...likes, username];
            return { ...prev, likes: { ...prev.likes, [postId]: newLikes } };
        });
        await api.toggleLike(postId, username);
    };

    const handleComment = async (postId) => {
        if(!commentText.trim()) return;
        const username = user?.username || 'admin';
        const newComment = { id: Date.now(), username: username, text: commentText, timestamp: 'Just now' };
        setSocialData(prev => ({ ...prev, comments: { ...prev.comments, [postId]: [...(prev.comments[postId] || []), newComment] } }));
        setCommentText('');
        await api.addComment(postId, username, commentText);
    };

    const handleDelete = (id) => {
        Swal.fire({ title: 'ยืนยันการลบ?', text: "ไม่สามารถกู้คืนได้", icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'ลบโพสต์' }).then((result) => {
            if (result.isConfirmed) api.deletePost(id).then(res => { if(res.success) { Swal.fire('ลบสำเร็จ!', '', 'success'); loadFeed(); } });
        });
    };

    const handleEdit = (post) => { setFormData(post); setUploadedImages(post.images || []); setFormBuilder(post.form_config || []); setView(post.type === 'news' ? 'create_news' : 'create_recruit'); };
    const handleViewRegistrations = async (post) => { setLoading(true); const res = await api.getPostRegistrations(post.post_id); setRegModal({ title: post.title, data: res, config: post.form_config }); setLoading(false); };

    // --- FORM BUILDER & UPLOAD ---
    const addField = (type) => setFormBuilder([...formBuilder, { id: Date.now(), type, label: type === 'auto_project' ? 'ชื่อโครงงาน (Auto)' : 'หัวข้อใหม่', options: '', required: true }]);
    const removeField = (id) => setFormBuilder(formBuilder.filter(f => f.id !== id));
    const updateField = (id, key, val) => setFormBuilder(formBuilder.map(f => f.id === id ? { ...f, [key]: val } : f));
    
    const handleImageSelect = async (e) => {
        const files = Array.from(e.target.files);
        if(files.length === 0) return;
        setIsUploading(true);
        const filePromises = files.map(file => new Promise(resolve => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({ base64: reader.result.split(',')[1], mimeType: file.type, fileName: file.name });
        }));
        const payloads = await Promise.all(filePromises);
        for (let p of payloads) {
            try { const res = await api.uploadPostImage(p); if(res.success) setUploadedImages(prev => [...prev, res.fileId]); } catch(err){}
        }
        setIsUploading(false);
    };
    const removeImage = (i) => setUploadedImages(prev => prev.filter((_, idx) => idx !== i));

    const handleSavePost = async () => {
        if(!formData.title) return Swal.fire('แจ้งเตือน', 'กรุณาระบุหัวข้อ', 'warning');
        const payload = {
            ...formData, type: view.includes('news') ? 'news' : 'recruitment', images: uploadedImages, 
            form_config: JSON.stringify(formBuilder), hashtags: formData.hashtags ? (Array.isArray(formData.hashtags) ? formData.hashtags : formData.hashtags.split(',').map(t => t.trim()).filter(t => t)) : []
        };
        try {
            const res = formData.post_id ? await api.updatePost(payload) : await api.savePost(payload);
            if (res.success) { Swal.fire({ title: 'สำเร็จ!', text: 'บันทึกเรียบร้อย', icon: 'success', timer: 1500, showConfirmButton: false }); setView('list'); }
        } catch(e) { Swal.fire('Error', e.toString(), 'error'); }
    };

    const handleStartCreate = (type) => { setFormData({ title: '', subtitle: '', organization: '', level: '', content: '', hashtags: '' }); setFormBuilder([]); setUploadedImages([]); setView(type === 'news' ? 'create_news' : 'create_recruit'); };

    // --- RENDER ---
    if (view === 'create_select') {
        return (
            <div className="p-8 max-w-2xl mx-auto animate-fadeIn">
                <button onClick={() => setView('list')} className="mb-4 text-gray-500 flex items-center gap-1 hover:text-gray-800"><Icons.ArrowLeft /> กลับหน้า Feed</button>
                <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">เลือกประเภทโพสต์</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <button onClick={() => handleStartCreate('news')} className="bg-white p-8 rounded-2xl border-2 border-blue-100 hover:border-blue-500 transition group text-center hover:shadow-lg"><div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition"><Icons.News /></div><h3 className="text-xl font-bold text-gray-800">ประกาศข่าวสาร</h3></button>
                    <button onClick={() => handleStartCreate('recruit')} className="bg-white p-8 rounded-2xl border-2 border-orange-100 hover:border-orange-500 transition group text-center hover:shadow-lg"><div className="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition"><Icons.Flag /></div><h3 className="text-xl font-bold text-gray-800">รับสมัครแข่งขัน</h3></button>
                </div>
            </div>
        );
    }

    if (view.startsWith('create_')) {
        const isRecruit = view === 'create_recruit';
        return (
            <div className="p-4 max-w-4xl mx-auto pb-20 animate-fadeIn">
                <div className="flex items-center gap-3 mb-6 border-b pb-4"><button onClick={() => setView('list')} className="p-2 hover:bg-gray-100 rounded-full"><Icons.ArrowLeft /></button><h2 className="text-xl font-bold text-gray-800">{formData.post_id ? 'แก้ไข' : 'สร้าง'} {isRecruit ? 'โพสต์รับสมัคร' : 'ประกาศข่าวสาร'}</h2></div>
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">{isRecruit ? 'หัวข้อรายการ *' : 'หัวข้อข่าว *'}</label><input type="text" className="w-full border p-2 rounded-lg" value={formData.title || ''} onChange={e => setFormData({...formData, title: e.target.value})} /></div>
                            {isRecruit ? (<><div><label className="block text-sm font-medium text-gray-700 mb-1">หน่วยงาน</label><input type="text" className="w-full border p-2 rounded-lg" value={formData.organization||''} onChange={e => setFormData({...formData, organization: e.target.value})} /></div><div><label className="block text-sm font-medium text-gray-700 mb-1">ระดับงาน</label><input type="text" className="w-full border p-2 rounded-lg" value={formData.level||''} onChange={e => setFormData({...formData, level: e.target.value})} /></div></>) : (<div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">เรื่อง/ประเด็น</label><input type="text" className="w-full border p-2 rounded-lg" value={formData.subtitle||''} onChange={e => setFormData({...formData, subtitle: e.target.value})} /></div>)}
                            <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">เนื้อหา *</label><textarea rows="5" className="w-full border p-2 rounded-lg" value={formData.content||''} onChange={e => setFormData({...formData, content: e.target.value})}></textarea></div>
                            <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Hashtags</label><input type="text" className="w-full border p-2 rounded-lg" value={formData.hashtags||''} onChange={e => setFormData({...formData, hashtags: e.target.value})} /></div>
                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-2">รูปภาพ ({uploadedImages.length})</label>
                                {uploadedImages.length > 0 && (
                                    <div className="grid grid-cols-3 md:grid-cols-5 gap-3 mb-3">
                                        {uploadedImages.map((imgId, idx) => (
                                            <div key={idx} className="relative group aspect-square rounded-lg overflow-hidden border border-gray-200">
                                                <img src={`https://lh3.googleusercontent.com/d/${imgId}`} onError={(e) => { e.target.onerror = null; e.target.src = `https://lh3.googleusercontent.com/d/${imgId}`; }} className="w-full h-full object-cover" />
                                                <button onClick={() => removeImage(idx)} className="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 shadow-md opacity-0 group-hover:opacity-100 transition"><Icons.X /></button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <label className={`border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:bg-gray-50 cursor-pointer block transition ${isUploading ? 'opacity-50 pointer-events-none' : ''}`}>
                                    <input type="file" multiple accept="image/*" className="hidden" onChange={handleImageSelect} disabled={isUploading} />
                                    {isUploading ? <div className="flex flex-col items-center text-indigo-500"><Icons.Loader /><span className="text-sm mt-2">กำลังอัปโหลด...</span></div> : <div className="flex flex-col items-center text-gray-500"><Icons.Image /><span className="text-sm mt-2">คลิกเพื่อเพิ่มรูปภาพ</span></div>}
                                </label>
                            </div>
                        </div>
                    </div>
                    {isRecruit && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-orange-200">
                            <div className="flex justify-between items-center mb-4"><h3 className="font-bold text-orange-800 flex items-center gap-2"><Icons.Flag /> แบบฟอร์มรับสมัคร</h3><div className="flex gap-2"><button onClick={() => addField('text')} className="text-xs bg-gray-100 px-3 py-1 rounded-lg">+ ข้อความ</button><button onClick={() => addField('dropdown')} className="text-xs bg-gray-100 px-3 py-1 rounded-lg">+ ตัวเลือก</button><button onClick={() => addField('auto_project')} className="text-xs bg-indigo-50 text-indigo-600 px-3 py-1 rounded-lg">+ โครงงาน (Auto)</button></div></div>
                            <div className="space-y-3 bg-gray-50 p-4 rounded-xl min-h-[100px]">{formBuilder.map((field) => (<div key={field.id} className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm relative group"><div className="flex justify-between items-start mb-2"><span className="bg-gray-100 text-gray-500 text-[10px] px-2 py-0.5 rounded uppercase font-bold">{field.type}</span><button onClick={() => removeField(field.id)} className="text-red-400 hover:text-red-600"><Icons.Trash /></button></div><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><input type="text" placeholder="หัวข้อ" className="border-b border-gray-300 outline-none py-1 text-sm font-bold w-full" value={field.label} onChange={(e) => updateField(field.id, 'label', e.target.value)} disabled={field.type === 'auto_project'} />{field.type === 'dropdown' && <input type="text" placeholder="ตัวเลือก (คั่น ,)" className="border-b border-gray-300 outline-none py-1 text-sm w-full" value={field.options} onChange={(e) => updateField(field.id, 'options', e.target.value)} />}</div></div>))}</div>
                        </div>
                    )}
                    <button onClick={handleSavePost} className={`w-full py-3 text-white rounded-xl font-bold shadow-lg transition transform active:scale-95 ${isUploading ? 'bg-gray-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700'}`} disabled={isUploading}>{isUploading ? 'กำลังอัปโหลดรูป...' : 'บันทึกข้อมูล'}</button>
                </div>
            </div>
        );
    }

    return (
        <div className="max-w-2xl mx-auto p-4 pb-24 space-y-6 animate-fadeIn">
            <div className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h1 className="text-xl font-bold text-gray-800">จัดการโพสต์</h1>
                <button onClick={() => setView('create_select')} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 font-bold transition"><Icons.Plus /> สร้างโพสต์ใหม่</button>
            </div>

            {loading ? <><PostSkeleton /><PostSkeleton /></> : posts.length === 0 ? <div className="text-center py-20 text-gray-400">ยังไม่มีโพสต์</div> : posts.map(post => {
                const likes = socialData.likes[post.post_id] || [];
                const comments = socialData.comments[post.post_id] || [];
                const isLiked = likes.includes(user?.username || 'admin');

                return (
                    <div key={post.post_id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative group">
                        <div className="absolute top-4 right-4 flex gap-1 z-10 opacity-0 group-hover:opacity-100 transition-opacity bg-white/80 backdrop-blur rounded-lg p-1 shadow-sm">
                            {post.type === 'recruitment' && <button onClick={() => handleViewRegistrations(post)} className="text-green-600 p-2 hover:bg-green-50 rounded-lg"><Icons.Users /></button>}
                            <button onClick={() => handleEdit(post)} className="text-blue-600 p-2 hover:bg-blue-50 rounded-lg"><Icons.Edit /></button>
                            <button onClick={() => handleDelete(post.post_id)} className="text-red-600 p-2 hover:bg-red-50 rounded-lg"><Icons.Trash /></button>
                        </div>

                        <div className="p-4 flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-white ${post.type === 'news' ? 'bg-blue-500' : 'bg-orange-500'}`}>{post.type === 'news' ? 'N' : 'R'}</div>
                            <div><h3 className="font-bold text-gray-800 leading-tight">{post.type === 'news' ? 'ประกาศข่าวสาร' : 'รับสมัครแข่งขัน'}</h3><p className="text-xs text-gray-500">{post.timestamp}</p></div>
                        </div>

                        <div className="px-4 pb-2">
                            <h2 className="text-lg font-bold text-gray-900 mb-1">{post.title}</h2>
                            {post.subtitle && <p className="text-sm font-medium text-gray-600 mb-2">{post.subtitle}</p>}
                            <p className="text-sm text-gray-700 whitespace-pre-wrap">{post.content}</p>
                            {post.hashtags && post.hashtags.length > 0 && (<div className="mt-2 flex flex-wrap gap-1">{post.hashtags.map((h, i) => <span key={i} className="text-blue-600 text-xs hover:underline cursor-pointer">{h}</span>)}</div>)}
                        </div>

                        {/* ✅ IMAGE GRID (With Click to Preview) */}
                        {post.images && post.images.length > 0 && (
                            <div className={`mt-2 px-4 pb-4 grid gap-1 ${post.images.length === 1 ? 'grid-cols-1' : post.images.length === 2 ? 'grid-cols-2' : 'grid-cols-2 md:grid-cols-3'}`}>
                                {post.images.map((imgId, idx) => (
                                    <img key={idx} 
                                        src={`https://lh3.googleusercontent.com/d/${imgId}`} 
                                        onError={(e) => { e.target.onerror = null; e.target.src = `https://lh3.googleusercontent.com/d/${imgId}`; }}
                                        onClick={() => setPreviewImageId(imgId)} // ✅ กดเพื่อดูรูปเต็ม
                                        className={`w-full object-cover rounded-lg border border-gray-100 cursor-pointer hover:opacity-90 transition ${post.images.length === 1 ? 'h-64' : 'h-40'}`} 
                                    />
                                ))}
                            </div>
                        )}

                        <div className="px-4 py-2 border-t border-gray-100 flex items-center justify-between text-gray-500 text-sm"><span>{likes.length} ถูกใจ</span><span>{comments.length} ความคิดเห็น</span></div>
                        <div className="px-2 border-t border-gray-100 flex">
                            <button onClick={() => handleLike(post.post_id)} className={`flex-1 py-2 flex items-center justify-center gap-2 hover:bg-gray-50 rounded-lg transition ${isLiked ? 'text-blue-600 font-bold' : 'text-gray-600'}`}><Icons.ThumbUp filled={isLiked} /> ถูกใจ</button>
                            <button onClick={() => setOpenComments(openComments === post.post_id ? null : post.post_id)} className="flex-1 py-2 flex items-center justify-center gap-2 hover:bg-gray-50 rounded-lg text-gray-600 transition"><Icons.Comment /> คอมเมนต์</button>
                        </div>

                        {openComments === post.post_id && (
                            <div className="bg-gray-50 p-4 border-t border-gray-100 animate-fadeIn">
                                <div className="space-y-3 mb-4 max-h-60 overflow-y-auto">
                                    {comments.map((c, i) => {
                                        const author = userMap[c.username] || { name: c.username, image: null };
                                        return (
                                            <div key={i} className="flex gap-2">
                                                <div className="flex-shrink-0">
                                                    {author.image ? <img src={author.image} className="w-8 h-8 rounded-full object-cover border border-gray-200" onError={(e)=>e.target.style.display='none'}/> : <div className="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-xs font-bold text-white">{author.name.charAt(0)}</div>}
                                                </div>
                                                <div className="bg-white p-2.5 rounded-2xl rounded-tl-none shadow-sm border border-gray-200 text-sm"><span className="font-bold text-gray-900 block text-xs">{author.name}</span><span className="text-gray-700">{c.text}</span></div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-2"><input type="text" placeholder="เขียนตอบกลับ..." className="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500" value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleComment(post.post_id)} /><button onClick={() => handleComment(post.post_id)} className="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700"><Icons.Send /></button></div>
                            </div>
                        )}
                    </div>
                );
            })}

            {/* ✅ FULLSCREEN IMAGE MODAL */}
            {previewImageId && (
                <div className="fixed inset-0 z-[300] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm animate-fadeIn" onClick={() => setPreviewImageId(null)}>
                    <button className="absolute top-5 right-5 text-white/70 hover:text-white transition"><Icons.X /></button>
                    <img 
                        src={`https://lh3.googleusercontent.com/d/${previewImageId}`} 
                        onError={(e) => { e.target.onerror = null; e.target.src = `https://lh3.googleusercontent.com/d/${previewImageId}`; }}
                        className="max-w-full max-h-full object-contain rounded-lg shadow-2xl"
                        onClick={e => e.stopPropagation()}
                    />
                </div>
            )}

            {/* Registration Modal */}

};

    if (showRequests) {

                onBack={() => { setShowRequests(false); loadPendingCount(); }}

    return (

                    >
                        <Icons.MessageSquare size={20} />

                            <span className="absolute top-0 right-0 w-4 h-4 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full border-2 border-white animate-pulse">

                    </button>

            {/* Content Area */}

                    <AdminProjectOverview dashboardStats={dashboardStats} year={dashboardYear} onYearChange={setDashboardYear} onNavigate={handleShortcut} />

                {/* ✅ เรียกใช้ AdminPostManager ที่เพิ่งสร้าง */}
                {activeTab === 'posts' && <AdminPostManager user={user} />}
                
                {/* ✅ เรียกใช้ AdminAwardHall ที่สร้างไว้แล้ว */}
                {activeTab === 'hall_of_fame' && <AdminAwardHall />}

                {activeTab === 'personnel' && <AdminPersonnelManager />}

                {activeTab === 'projects' && (
                    <div>

                            <ProjectList 
                                onCreate={() => { setEditData(null); setProjectAction('create'); }} 
                                onImport={() => setProjectAction('import')}
                                onEdit={(project) => { setEditData(project); setProjectAction('create'); }}
                            />
                        ) : projectAction === 'create' ? (
                            <ProjectManager onBack={() => setProjectAction('list')} initialData={editData} />
                        ) : (
                            <ProjectImport onBack={() => setProjectAction('list')} />
                        )}
                    </div>
                )}                    
                {activeTab === 'files' && <AdminFileRepository />}
                {activeTab === 'evaluation' && (
                    <div>
                        {!selectedRound ? (
                            <>
                                <h1 className="text-xl font-bold text-slate-800 mb-4 px-2">เลือกการประเมิน</h1>
                                <EvaluationRoundList onSelect={(round) => {
                                    setSelectedRound(round);
                                    if (ROUNDS_WITH_ADVISOR.includes(round.id)) { setEvaluationSubMode(null); } else { setEvaluationSubMode('committee'); }
                                }} />
                            </>
                        ) : !evaluationSubMode ? (
                            <EvaluationModeSelector round={selectedRound} onSelect={setEvaluationSubMode} />
                        ) : evaluationAction === 'committee' ? (
                            <CommitteeManager round={selectedRound} allRounds={EVALUATION_ROUNDS} onBack={() => setEvaluationAction(null)} />
                        ) : evaluationAction === 'criteria' ? (
                            <CriteriaManager 
                                round={{
                                    ...selectedRound,
                                    id: evaluationSubMode === 'advisor' ? 'universal_advisor_criteria' : selectedRound.id,
                                    label: evaluationSubMode === 'advisor' ? 'เกณฑ์การประเมินโดยที่ปรึกษา' : `${selectedRound.label} (กรรมการ)`
                                }} 
                                onBack={() => setEvaluationAction(null)} 
                            />
                        ) : evaluationAction === 'schedule' ? (
                            <ScheduleManager round={selectedRound} onBack={() => setEvaluationAction(null)} onGoToCommittee={() => setEvaluationAction('committee')} />
                        ) : evaluationAction === 'result' ? (
                            <AdminEvaluationResult round={selectedRound} subMode={evaluationSubMode} onBack={() => setEvaluationAction(null)} />
                        ) : (
                            <EvaluationActionMenu />
                        )}
                    </div>
                )}
            </div>

            {/* Bottom Nav */}
            <div className="fixed bottom-0 left-0 right-0 h-[72px] bg-white border-t border-gray-100 flex justify-around items-center pb-2 px-2 z-[150] w-full md:max-w-5xl mx-auto shadow-up transition-all duration-300">
                {[
                    {id:'dashboard', icon:Icons.Layout, label:'ภาพรวม'},
                    {id:'posts', icon:Icons.FileText, label:'โพสต์'},
                    {id:'projects', icon:Icons.Folder, label:'โครงงาน'},
                    {id:'hall_of_fame', icon:Icons.Award, label:'ทำเนียบ'}, // ✅ เมนูทำเนียบ
                    {id:'evaluation', icon:Icons.ClipboardCheck, label:'ประเมิน'},
                    {id:'personnel', icon:Icons.Users, label:'บุคลากร'}
                ].map(tab => (
                    <button key={tab.id} 
                        onClick={()=>{
                            setActiveTab(tab.id);
                            if(tab.id !== 'evaluation') setSelectedRound(null); 
                        }} 
                        className={`flex flex-col items-center justify-center w-16 h-full transition-colors ${activeTab===tab.id ? 'text-slate-800' : 'text-gray-400'}`}>
                        <tab.icon size={24} strokeWidth={activeTab===tab.id ? 2.5 : 2} weight={activeTab===tab.id ? 'fill' : 'regular'} />
                        <span className="text-[10px] font-medium">{tab.label}</span>
                    </button>
                ))}
            </div>
        </div>
    );
};

    const getEmbedUrl = (url) => {
        if (!url) return "";
        
        // พยายามดึง ID จาก Pattern ต่างๆ ของ Drive URL
        let fileId = "";
        const match1 = url.match(/\/d\/(.+?)\//); // หาจาก /d/xxxxx/
        const match2 = url.match(/id=(.+?)(&|$)/); // หาจาก id=xxxxx
        
        if (match1) fileId = match1[1];
        else if (match2) fileId = match2[1];

        // ถ้าได้ ID ให้ใช้ Google Drive Preview (แสดงได้ทั้ง Word, PDF, Slide)
        if (fileId) {
            return `https://drive.google.com/file/d/${fileId}/preview`;
        }

        // Fallback: ถ้าหา ID ไม่เจอจริงๆ ให้ใช้แบบเดิม
        return url.replace(/\/view.*/, '/preview');
    };

       if (isNaN(d.getTime())) d = new Date(dateStr.replace(" ", "T"));
