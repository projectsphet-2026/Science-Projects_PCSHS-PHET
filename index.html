// --- EVALUATION WIZARD (UPDATED FOR NEW CRITERIA STRUCTURE) ---
    const EvaluationWizard = ({ task, user, onBack, onComplete }) => {
        const [step, setStep] = useState('loading'); // loading, scoring, review, saving
        
        // Data State
        const [criteriaItems, setCriteriaItems] = useState([]);
        const [maxScale, setMaxScale] = useState(5); // คะแนนเต็มของสเกล (เช่น 5)
        const [scores, setScores] = useState({}); // เก็บค่าที่กรอก { itemId: value }
        const [feedback, setFeedback] = useState('');
        
        // Load Criteria
        useEffect(() => {
            const load = async () => {
                try {
                    // Logic การเลือก ID เกณฑ์
                    // ถ้าเป็น Advisor ให้ดึงเกณฑ์กลาง (ตามที่ตั้งค่าใน Admin)
                    // ถ้าเป็น Committee ให้ดึงตามรอบ
                    const targetId = task.role === 'advisor' ? 'universal_advisor_criteria' : task.round_id;
                    
                    const res = await api.getCriteria(targetId);
                    
                    if (res && res.items) {
                        setMaxScale(Number(res.max_score_scale) || 5);
                        setCriteriaItems(res.items);
                        
                        // Initialize inputs
                        const initScores = {};
                        res.items.forEach(c => initScores[c.id] = '');
                        setScores(initScores);
                        
                        setStep('scoring');
                    } else {
                        // ไม่พบเกณฑ์
                        setCriteriaItems([]);
                        setStep('scoring'); // ให้ไปหน้า scoring เพื่อแสดง Alert
                    }
                } catch(e) { 
                    console.error(e); 
                    Swal.fire('Error', 'โหลดเกณฑ์ไม่สำเร็จ', 'error'); 
                    onBack(); 
                }
            };
            load();
        }, [task]);

        // Handle Input Change
        const handleScoreChange = (id, val) => {
            let num = parseFloat(val);
            if (isNaN(num)) {
                setScores(prev => ({ ...prev, [id]: '' }));
                return;
            }
            // Validation: ห้ามเกิน Max Scale
            if (num > maxScale) num = maxScale;
            if (num < 0) num = 0;
            
            setScores(prev => ({ ...prev, [id]: num }));
        };

        // Calculate Result
        const calculateResult = () => {
            let totalScore = 0; // คะแนนที่ได้จริง
            let fullScore = 0;  // คะแนนเต็มจริง (ตาม weight)
            let isComplete = true;

            criteriaItems.forEach(c => {
                const inputVal = parseFloat(scores[c.id]);
                const weight = parseFloat(c.multiplier) || 1;

                if (isNaN(inputVal)) isComplete = false;
                
                // คำนวณ: (คะแนนที่กรอก * ตัวคูณ)
                totalScore += (isNaN(inputVal) ? 0 : inputVal) * weight;
                fullScore += (maxScale * weight);
            });

            const percent = fullScore > 0 ? ((totalScore / fullScore) * 100).toFixed(2) : 0;
            return { total: totalScore.toFixed(2), full: fullScore.toFixed(2), percent, isComplete };
        };

        const handleGoToReview = () => {
            const { isComplete } = calculateResult();
            if (!isComplete) {
                return Swal.fire('แจ้งเตือน', 'กรุณากรอกคะแนนให้ครบทุกช่อง', 'warning');
            }
            setStep('review');
        };

        const handleConfirmSave = async () => {
            setStep('saving');
            const { total, full, percent } = calculateResult();
            
            const payload = {
                round_id: task.round_id,
                project_id: task.project_id,
                evaluator: user.username,
                role: task.role,
                total_score: total,
                full_score: full,
                percentage: percent,
                scores: scores, // เก็บ Raw Input (0-5) ไว้
                feedback: feedback
            };

            try {
                await api.saveEvaluation(payload);
                await Swal.fire('สำเร็จ', 'บันทึกผลการประเมินเรียบร้อย', 'success');
                onComplete(); 
            } catch(e) {
                Swal.fire('Error', 'บันทึกไม่สำเร็จ', 'error');
                setStep('review');
            }
        };

        // --- RENDER ---
        if (step === 'loading') return <div className="fixed inset-0 bg-white z-[200] flex items-center justify-center"><Icons.Loader2 className="spin text-blue-500" size={48}/></div>;

        return (
            // แก้ตรงนี้ครับ: จาก z-50 เปลี่ยนเป็น z-[200]
            <div className="fixed inset-0 bg-gray-50 z-[200] flex flex-col animate-fadeIn">
                
                {/* Header */}
                <div className="bg-white px-4 py-3 border-b shadow-sm flex items-center justify-between shrink-0">
                    <button onClick={onBack} className="p-2 -ml-2 text-gray-500 hover:bg-gray-100 rounded-full">
                        <Icons.ChevronRight className="rotate-180" size={24}/>
                    </button>
                    <div className="text-center">
                        <h2 className="font-bold text-gray-800 text-sm">แบบประเมินโครงงาน</h2>
                        <p className="text-[10px] text-gray-500">{task.project_id}</p>
                    </div>
                    <div className="w-8"></div>
                </div>

                {/* SCROLLABLE CONTENT */}
                <div className="flex-1 overflow-y-auto p-4 pb-32">
                    
                    {/* Project Info Card */}
                    <div className="bg-blue-600 text-white p-5 rounded-2xl shadow-lg shadow-blue-200 mb-6">
                        <div className="flex items-start gap-3">
                            <div className="p-2 bg-white/20 rounded-lg backdrop-blur-sm">
                                <Icons.FileText size={24} className="text-white"/>
                            </div>
                            <div>
                                <h3 className="font-bold text-lg leading-tight mb-1">{task.project_name}</h3>
                                <p className="text-blue-100 text-xs opacity-90">
                                    {EVALUATION_ROUNDS.find(r=>r.id===task.round_id)?.label || task.round_id} 
                                    <span className="mx-2">•</span> 
                                    {task.role === 'advisor' ? 'ที่ปรึกษา' : 'กรรมการ'}
                                </p>
                            </div>
                        </div>
                    </div>

                    {step === 'scoring' && (
                        <div className="space-y-6 animate-slideUp">
                            <div className="flex justify-between items-end">
                                <h4 className="font-bold text-gray-700 flex items-center gap-2">
                                    <Icons.ClipboardCheck size={18} className="text-blue-500"/> รายการประเมิน
                                </h4>
                                <span className="text-[10px] text-gray-500 bg-gray-200 px-2 py-1 rounded">Scale: 0 - {maxScale}</span>
                            </div>
                            
                            {criteriaItems.length === 0 ? (
                                <div className="text-center py-10 px-4 bg-red-50 rounded-xl border border-red-100 border-dashed">
                                    <div className="text-3xl mb-2">⚠️</div>
                                    <h3 className="text-red-600 font-bold">ไม่พบเกณฑ์การประเมิน</h3>
                                    <p className="text-xs text-red-400 mt-1">ผู้ดูแลระบบยังไม่ได้กำหนดเกณฑ์สำหรับรอบนี้</p>
                                </div>
                            ) : (
                                criteriaItems.map((c, idx) => {
                                    const rawScore = parseFloat(scores[c.id]) || 0;
                                    const weight = parseFloat(c.multiplier) || 1;
                                    const finalScore = (rawScore * weight).toFixed(2);
                                    
                                    return (
                                        <div key={c.id} className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                                            <div className="mb-2">
                                                <label className="font-bold text-gray-800 text-sm block">
                                                    {idx+1}. {c.title || c.name}
                                                </label>
                                                {/* แสดงข้อย่อย */}
                                                {c.details && Array.isArray(c.details) && (
                                                    <ul className="mt-1 pl-4 list-disc text-xs text-gray-500 space-y-0.5">
                                                        {c.details.map((d, i) => d && <li key={i}>{d}</li>)}
                                                    </ul>
                                                )}
                                            </div>

                                            <div className="flex items-center gap-3 bg-gray-50 p-2 rounded-lg mt-3">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2">
                                                        <input 
                                                            type="number" 
                                                            value={scores[c.id]} 
                                                            onChange={(e) => handleScoreChange(c.id, e.target.value)}
                                                            placeholder="0"
                                                            className="w-full p-2 text-lg font-bold text-center bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                                        />
                                                        <span className="text-xs text-gray-400 font-bold whitespace-nowrap">/ {maxScale}</span>
                                                    </div>
                                                </div>
                                                
                                                <div className="text-right pl-3 border-l border-gray-200">
                                                    <div className="text-[10px] text-gray-400">Weight x{weight}</div>
                                                    <div className="font-bold text-blue-600">{finalScore} <span className="text-[10px]">คะแนน</span></div>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })
                            )}

                            {/* Feedback Input */}
                            <div className="mt-8">
                                <h4 className="font-bold text-gray-700 flex items-center gap-2 mb-3">
                                    <Icons.Edit size={18} className="text-orange-500"/> ข้อเสนอแนะเพิ่มเติม
                                </h4>
                                <textarea 
                                    rows="4" 
                                    placeholder="พิมพ์ข้อเสนอแนะสำหรับนักเรียน..." 
                                    value={feedback}
                                    onChange={(e) => setFeedback(e.target.value)}
                                    className="w-full p-4 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-200 outline-none text-sm"
                                ></textarea>
                            </div>
                        </div>
                    )}

                    {step === 'review' && (
                        <div className="animate-slideUp space-y-4">
                            <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm text-center">
                                <h3 className="text-gray-500 font-bold mb-4 uppercase tracking-widest text-xs">สรุปคะแนนประเมิน</h3>
                                
                                {(() => {
                                    const { total, full, percent } = calculateResult();
                                    return (
                                        <div>
                                            <div className="flex justify-center items-end gap-2 mb-2">
                                                <span className="text-5xl font-black text-blue-600">{total}</span>
                                                <span className="text-xl text-gray-400 font-bold mb-2">/ {full}</span>
                                            </div>
                                            <div className="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-lg font-bold text-sm border border-blue-100">
                                                คิดเป็น {percent} %
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>

                            <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-100 text-xs text-yellow-800 flex gap-2">
                                <Icons.AlertCircle size={16} className="shrink-0 mt-0.5"/>
                                <span>โปรดตรวจสอบความถูกต้อง คะแนนที่ยืนยันแล้วจะไม่สามารถแก้ไขได้ในภายหลัง</span>
                            </div>

                            {/* Show details for review */}
                            <div className="bg-white rounded-xl border border-gray-200 divide-y overflow-hidden">
                                {criteriaItems.map((c) => {
                                    const raw = parseFloat(scores[c.id]) || 0;
                                    const w = parseFloat(c.multiplier) || 1;
                                    return (
                                        <div key={c.id} className="p-3 flex justify-between items-center text-sm">
                                            <div className="w-2/3">
                                                <div className="text-gray-800 font-bold truncate">{c.title || c.name}</div>
                                                <div className="text-[10px] text-gray-400">ให้ {raw} (x{w})</div>
                                            </div>
                                            <span className="font-bold text-green-600">{(raw * w).toFixed(2)}</span>
                                        </div>
                                    );
                                })}
                                {feedback && (
                                    <div className="p-3 bg-gray-50">
                                        <span className="text-[10px] font-bold text-gray-400 uppercase">Comment</span>
                                        <p className="text-sm text-gray-600 mt-1 italic">"{feedback}"</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                </div>

                {/* Sticky Bottom Bar */}
                <div className="bg-white p-4 border-t shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 shrink-0 safe-area-bottom">
                    {step === 'scoring' ? (
                        <button 
                            onClick={handleGoToReview}
                            disabled={criteriaItems.length === 0}
                            className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 flex items-center justify-center gap-2 hover:bg-blue-700 active:scale-95 transition-all disabled:bg-gray-300 disabled:shadow-none"
                        >
                            ตรวจสอบคะแนน <Icons.ChevronRight size={20}/>
                        </button>
                    ) : step === 'review' ? (
                        <div className="flex gap-3">
                            <button onClick={() => setStep('scoring')} className="flex-1 bg-gray-100 text-gray-600 font-bold py-3.5 rounded-xl">
                                แก้ไข
                            </button>
                            <button 
                                onClick={handleConfirmSave}
                                className="flex-[2] bg-green-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-green-200 flex items-center justify-center gap-2 hover:bg-green-700 active:scale-95 transition-all"
                            >
                                <Icons.Save size={20}/> ยืนยันการประเมิน
                            </button>
                        </div>
                    ) : (
                        <div className="text-center text-gray-400 text-sm font-bold">กำลังบันทึก...</div>
                    )}
                </div>

            </div>
        );
    };

    const TeacherEvaluationList = ({ user }) => {
        const [view, setView] = useState('menu'); 
        const [selectedRoundId, setSelectedRoundId] = useState(null);
        const [activeTask, setActiveTask] = useState(null);
        
        // เพิ่ม State สำหรับจัดการ Tab (committee หรือ advisor)
        const [activeTab, setActiveTab] = useState('committee'); 

        const [tasks, setTasks] = useState({ committee: [], advisor: [] });
        const [isLoading, setIsLoading] = useState(false);

        const currentYear = String(new Date().getFullYear() + 543);

        useEffect(() => {
            fetchTasks();
        }, []);

        const fetchTasks = async () => {
            setIsLoading(true);
            try {
                const res = await api.getTeacherEvaluations(user.username);
                // ตรวจสอบข้อมูลดิบ (Debugging)
                console.log("Evaluation Tasks:", res); 
                setTasks(res);
            } catch(e) { console.error(e); }
            setIsLoading(false);
        };

        const getPendingCount = (roundId) => {
            const commPending = tasks.committee.filter(t => t.round_id === roundId && t.year === currentYear && t.status !== 'completed').length;
            const advPending = tasks.advisor.filter(t => t.round_id === roundId && t.year === currentYear && t.status !== 'completed').length;
            return commPending + advPending;
        };

        const getFilteredTasks = () => {
            if (!selectedRoundId) return { committee: [], advisor: [] };
            return {
                committee: tasks.committee.filter(t => t.round_id === selectedRoundId && t.year === currentYear),
                advisor: tasks.advisor.filter(t => t.round_id === selectedRoundId && t.year === currentYear)
            };
        };

        const TaskCard = ({ item }) => {
            const isCompleted = item.status === 'completed';
            const isOverdue = item.is_overdue;

            return (
                <div className={`bg-white rounded-xl p-4 border shadow-sm relative overflow-hidden transition-all hover:shadow-md ${isOverdue ? 'border-red-300 bg-red-50/30' : 'border-gray-200'}`}>
                    {/* Role Label แยกสีชัดเจน */}
                    <div className="flex justify-between items-start mb-2">
                        <span className={`text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded ${item.role === 'advisor' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>

                        {isCompleted ? <span className="flex items-center gap-1 text-[10px] font-bold bg-green-100 text-green-700 px-2 py-1 rounded-full">✅ ประเมินแล้ว</span> 
                        : isOverdue ? <span className="flex items-center gap-1 text-[10px] font-bold bg-red-100 text-red-600 px-2 py-1 rounded-full animate-pulse">⚠️ เลยกำหนด</span>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {/* === VERTICAL PROGRESS TRACKER (With Schedule) === */}

                <h3 className="font-bold text-gray-800 mb-6 flex items-center gap-2 px-2">
                    <Icons.Activity className="text-indigo-600" size={24} /> 
                    <span>เส้นทางความสำเร็จ</span>
                    <span className="text-xs font-normal text-gray-400 ml-auto bg-gray-100 px-2 py-1 rounded-full">
                        {evaluations.length} / {STEPS.length} สำเร็จ
                    </span>
                </h3>

                <div className="relative pl-4 space-y-0">
                    <div className="absolute left-[27px] top-4 bottom-8 w-1 bg-gray-100 rounded-full -z-0"></div>

                    {STEPS.map((step, idx) => {
                        const status = getStepStatus(step.id, idx);
                        const isLast = idx === STEPS.length - 1;
                        const sched = schedules[step.id];
                        
                        let iconBoxClass = "bg-white border-2 border-gray-100 text-gray-300";
                        let cardClass = "bg-white border-gray-100 opacity-60 grayscale-[0.5]";
                        
                        if (status === 'completed') {
                            iconBoxClass = "bg-green-500 border-green-500 text-white shadow-lg shadow-green-200 z-10";
                            cardClass = "bg-white border-green-100 shadow-sm cursor-pointer hover:shadow-md hover:border-green-200";
                        } else if (status === 'current') {
                            iconBoxClass = "bg-blue-600 border-blue-600 text-white ring-4 ring-blue-50 shadow-xl shadow-blue-200 z-10 scale-110";
                            cardClass = "bg-gradient-to-br from-white to-blue-50 border-blue-200 shadow-md ring-1 ring-blue-100 cursor-pointer";
                        }

                        return (
                            <div key={step.id} className={`relative flex gap-4 ${!isLast ? 'pb-8' : ''}`}>
                                <div className={`relative shrink-0 w-14 h-14 rounded-full flex items-center justify-center transition-all duration-500 ${iconBoxClass}`}>
                                    {status === 'completed' ? <Icons.CheckCircle size={24} /> : 
                                     status === 'locked' ? <Icons.Lock size={20} /> :
                                     <step.icon size={24} />}
                                </div>

                                <div 
                                    onClick={() => { if (status !== 'locked') onGoToResult(step.id); }}
                                    className={`flex-1 p-4 rounded-2xl border transition-all duration-300 flex flex-col justify-center group ${cardClass}`}
                                >
                                    <div className="flex justify-between items-start w-full">
                                        <div>
                                            <h4 className={`font-bold text-sm mb-1 ${status === 'current' ? 'text-blue-800' : 'text-gray-800'}`}>
                                                {step.label}
                                            </h4>
                                            <p className="text-xs text-gray-500">{step.subtitle}</p>
                                        </div>
                                        {status !== 'locked' && (
                                            <div className="w-6 h-6 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                                <Icons.ChevronRight size={14} />
                                            </div>
                                        )}
                                    </div>

                                    {sched && (
                                        <div className="mt-3 pt-3 border-t border-dashed border-gray-200 flex flex-wrap gap-2">
                                            <div className="flex items-center gap-1 bg-orange-50 text-orange-700 px-2 py-1 rounded text-[10px] font-bold border border-orange-100">
                                                <span>📅 {sched.date}</span>
                                            </div>
                                            <div className="flex items-center gap-1 bg-blue-50 text-blue-700 px-2 py-1 rounded text-[10px] font-bold border border-blue-100">
                                                <span>⏰ {sched.time || '-'}</span>
                                            </div>
                                            <div className="flex items-center gap-1 bg-gray-100 text-gray-600 px-2 py-1 rounded text-[10px] font-bold border border-gray-200 truncate max-w-[150px]">
                                                <span>📍 {sched.venue}</span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
};





// --- [UPDATED v6] PROJECT SUBMISSION (Student View - Fixed Modal Position with Portal) ---
const ProjectSubmission = ({ project, user }) => {
    const [files, setFiles] = React.useState([]);
    const [loading, setLoading] = React.useState(false);
    const [uploadingTarget, setUploadingTarget] = React.useState(null); 
    const [previewFile, setPreviewFile] = React.useState(null);

    // --- ICONS (Local Definitions) ---
    const Icons = {
        UploadCloud: ({size, className}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>,
        FileText: ({size, className}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>,
        File: ({size, className}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>,
        Monitor: ({size, className}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>,
        Image: ({size, className}) => <svg className={className} width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
        Edit: ({size}) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>,
        Upload: ({size}) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>,
        X: ({size}) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>,
        Search: ({size}) => <svg width={size} height={size} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    };

    React.useEffect(() => { loadFiles(); }, [project]);

    const loadFiles = () => {
        google.script.run.withSuccessHandler(setFiles).getProjectFiles(project.id);
    };

    const getEmbedUrl = (url) => {
        if (!url) return "";
        let fileId = "";
        const match1 = url.match(/\/d\/(.+?)\//);
        const match2 = url.match(/id=(.+?)(&|$)/);
        if (match1) fileId = match1[1];
        else if (match2) fileId = match2[1];

        if (fileId) return `https://drive.google.com/file/d/${fileId}/preview`;
        
        return url.replace(/\/view.*/, '/preview');
    };

    const handleFileChange = (e, type, ext) => {
        const file = e.target.files[0];
        if (!file) return;

        if (ext === 'pdf' && file.type !== 'application/pdf') {
            Swal.fire('ผิดพลาด', 'กรุณาอัปโหลดไฟล์ PDF เท่านั้น', 'error'); return;
        }
        if (ext === 'doc' && !file.name.match(/\.(doc|docx)$/i)) {
            Swal.fire('ผิดพลาด', 'กรุณาอัปโหลดไฟล์ Word (.doc, .docx) เท่านั้น', 'error'); return;
        }

        setUploadingTarget(`${type}_${ext}`);
        setLoading(true);

        const reader = new FileReader();
        reader.onload = function(e) {
            const payload = {
                projectId: project.id,
                projectYear: project.year,
                projectCategory: project.category || "General",
                fileType: type,
                fileExt: ext,
                studentName: `${user.firstname} ${user.lastname || ''}`.trim(),
                fileData: e.target.result,
                mimeType: file.type
            };

            google.script.run.withSuccessHandler((res) => {
                setLoading(false);
                setUploadingTarget(null);
                if (res.success) {
                    Swal.fire({ icon: 'success', title: 'อัปโหลดสำเร็จ', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                    setFiles(prev => [...prev.filter(f => !(f.type === type && f.ext === ext)), {
                        type: type, ext: ext, name: file.name, url: res.url, uploaded_by: user.firstname, timestamp: res.timestamp
                    }]);
                } else {
                    Swal.fire('Error', res.message, 'error');
                }
            }).uploadProjectFile(payload);
        };
        reader.readAsDataURL(file);
    };

    const renderSectionContainer = (title, colorClass, icon, children) => (
        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-4">
            <div className={`px-4 py-3 border-b border-gray-100 flex items-center gap-2 ${colorClass}`}>
                {icon}
                <h4 className="font-bold text-gray-700 text-sm">{title}</h4>
            </div>
            <div className="p-3 space-y-2 bg-white">
                {children}
            </div>
        </div>
    );

    const renderUploadButton = (label, type, ext, icon) => {
        const fileData = files.find(f => f.type === type && f.ext === ext);
        const isUploading = uploadingTarget ===(`${type}_${ext}`);
        const formatDate = (dStr) => {
            if (!dStr) return "-";
            const d = new Date(dStr);
            return isNaN(d.getTime()) ? dStr : d.toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'});
        };

        return (
            <div className="flex items-center justify-between bg-gray-50 p-3 rounded-lg border border-gray-100 transition-all hover:bg-gray-50/80">
                <div className="flex items-center gap-3 min-w-0">
                    <div className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 ${fileData ? 'bg-green-100 text-green-600' : 'bg-white border border-gray-200 text-gray-300'}`}>
                        {icon}
                    </div>
                    <div className="min-w-0">
                        <div className="text-sm font-semibold text-gray-700 truncate pr-2">
                            {label} <span className="text-[10px] text-gray-400 font-normal uppercase">.{ext}</span>
                        </div>
                        {fileData ? (
                            <div className="text-[10px] text-green-600 truncate">
                                ✓ ส่งแล้ว: {formatDate(fileData.timestamp)}
                            </div>
                        ) : (
                            <div className="text-[10px] text-red-400">ยังไม่ส่ง</div>
                        )}
                    </div>
                </div>
                
                <div className="flex items-center gap-1 shrink-0">
                    {fileData && (
                        <button onClick={() => setPreviewFile(fileData)} className="p-2 text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition" title="ดูตัวอย่าง">
                            <Icons.Search size={16}/>
                        </button>
                    )}
                    <label className={`cursor-pointer px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm ${fileData ? 'bg-white border border-gray-200 text-gray-700 hover:bg-gray-50' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                        {isUploading ? <span className="animate-spin">⏳</span> : (fileData ? <Icons.Edit size={14}/> : <Icons.Upload size={14}/>)}
                        <span className="hidden sm:inline">{isUploading ? '...' : (fileData ? ' แก้ไข' : ' ส่งไฟล์')}</span>
                        <span className="sm:hidden">{isUploading ? '...' : (fileData ? ' แก้' : ' ส่ง')}</span>
                        <input type="file" className="hidden" accept={ext === 'pdf' ? ".pdf" : ".doc,.docx"} onChange={(e) => handleFileChange(e, type, ext)} disabled={loading} />
                    </label>
                </div>
            </div>
        );
    };

    return (
        <div className="mt-8 animate-fadeIn">
            <h3 className="font-bold text-gray-800 flex items-center gap-2 mb-4 px-1">
                <Icons.UploadCloud className="text-indigo-600" size={24} />
                ส่งเล่มโครงงานและเอกสาร
            </h3>
            
            {renderSectionContainer("1. โครงร่างโครงงาน (Proposal)", "bg-indigo-50/50", <Icons.FileText size={18} className="text-indigo-600"/>, <>
                {renderUploadButton("เล่มโครงร่าง (Word)", "proposal", "doc", <Icons.FileText size={16}/>)}
                {renderUploadButton("เล่มโครงร่าง (PDF)", "proposal", "pdf", <Icons.File size={16}/>)}
                <div className="border-t border-dashed border-indigo-100 my-1"></div>
                {renderUploadButton("สไลด์นำเสนอ (PDF)", "proposal_slide", "pdf", <Icons.Monitor size={16}/>)}
            </>)}

            {renderSectionContainer("2. บทคัดย่อ (ภาษาไทย)", "bg-blue-50/50", <Icons.FileText size={18} className="text-blue-600"/>, <>
                {renderUploadButton("ไฟล์ Word", "abstract_th", "doc", <Icons.FileText size={16}/>)}
                {renderUploadButton("ไฟล์ PDF", "abstract_th", "pdf", <Icons.File size={16}/>)}
            </>)}

            {renderSectionContainer("3. Abstract (English)", "bg-purple-50/50", <Icons.FileText size={18} className="text-purple-600"/>, <>
                {renderUploadButton("ไฟล์ Word", "abstract_en", "doc", <Icons.FileText size={16}/>)}
                {renderUploadButton("ไฟล์ PDF", "abstract_en", "pdf", <Icons.File size={16}/>)}
            </>)}

            {renderSectionContainer("4. สื่อนำเสนอ (Presentation & Poster)", "bg-orange-50/50", <Icons.Monitor size={18} className="text-orange-600"/>, <>
                {renderUploadButton("สไลด์นำเสนอ (Final)", "slide", "pdf", <Icons.Monitor size={16}/>)}
                {renderUploadButton("โปสเตอร์", "poster", "pdf", <Icons.Image size={16}/>)}
            </>)}

            {/* ✅ ใช้ ReactDOM.createPortal เพื่อดีด Modal ออกไปแสดงผลที่ document.body */}
            {previewFile && ReactDOM.createPortal(
                <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fadeIn" onClick={() => setPreviewFile(null)}>
                    <div className="bg-white rounded-xl overflow-hidden w-full max-w-6xl h-[90vh] flex flex-col shadow-2xl" onClick={e => e.stopPropagation()}>
                        
                        <div className="flex justify-between items-center p-3 border-b bg-gray-50 shrink-0">
                            <div>
                                <h3 className="font-bold text-gray-800 text-sm">ตัวอย่างเอกสาร: {previewFile.name}</h3>
                                <p className="text-[10px] text-gray-500">ประเภท: {previewFile.ext.toUpperCase()}</p>
                            </div>
                            <button onClick={() => setPreviewFile(null)} className="p-1 hover:bg-gray-200 rounded-full transition"><Icons.X size={20}/></button>
                        </div>
                        
                        <div className="flex-1 bg-gray-200 p-0 overflow-hidden relative flex flex-col">
                            {['pdf', 'doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx'].includes(previewFile.ext.toLowerCase()) ? (
                                <iframe 
                                    src={getEmbedUrl(previewFile.url)} 
                                    className="w-full h-full border-0 bg-white" 
                                    allow="autoplay"
                                    title="Document Preview"
                                ></iframe>
                            ) : (
                                <div className="w-full h-full flex items-center justify-center overflow-auto p-4">
                                    <img 
                                        src={`http://googleusercontent.com/profile/picture/${previewFile.id || ''}`} 
                                        className="max-w-full max-h-full object-contain shadow-md" 
                                        alt="Preview" 
                                        onError={(e) => { e.target.style.display='none'; }} 
                                    />
                                </div>
                            )}
                            
                            <a href={previewFile.url} target="_blank" className="absolute bottom-4 right-4 bg-white/90 hover:bg-white text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg flex items-center gap-1 backdrop-blur-sm border border-gray-200 z-10 hover:scale-105 transition-transform">
                                <Icons.FileText size={14}/> เปิดในหน้าต่างใหม่
                            </a>
                        </div>
                    </div>
                </div>,
                document.body // target container
            )}
        </div>
    );
};

                    Swal.fire('Error', res.message, 'error');

                        </div>

    // --- [UPDATED v3] STUDENT: EVALUATION TAB (Separate Committee & Advisor) ---
    const StudentEvaluationTab = ({ evaluations, initialRound }) => {
        const [activeRound, setActiveRound] = useState('all');

        const rounds = useMemo(() => {
            if (!evaluations || evaluations.length === 0) return {};
            const grouped = {};
            evaluations.forEach(ev => {
                const r = ev.round || 'ทั่วไป';
                if (!grouped[r]) {
                    grouped[r] = { 
                        name: r, 
                        // ✅ แยกการเก็บคะแนนเป็น 2 ส่วน
                        committee: { total_score: 0, total_full: 0, count: 0, criteria_sum: {} },
                        advisor: { total_score: 0, total_full: 0, count: 0, criteria_sum: {} },
                        feedbacks: [] 
                    };
                }

                // ✅ แยกโยนข้อมูลเข้ากลุ่มให้ถูก
                const targetGroup = ev.role === 'advisor' ? grouped[r].advisor : grouped[r].committee;
                
                targetGroup.total_score += ev.total;
                targetGroup.total_full += ev.full;
                targetGroup.count++;
                
                if (ev.feedback) {
                    grouped[r].feedbacks.push({ 
                        evaluator: ev.evaluator,
                        evaluatorName: ev.evaluatorName || ev.evaluator, 
                        evaluatorImage: ev.evaluatorImage, 
                        role: ev.role, 
                        text: ev.feedback 
                    });
                }
                
                if (ev.criteria_meta && ev.scores_detail) {
                    const itemMap = ev.criteria_meta.itemMap || {}; 
                    const maxScale = ev.criteria_meta.max || 5;
                    Object.keys(ev.scores_detail).forEach(cid => {
                         const meta = itemMap[cid] || { title: `ข้อ ${cid}`, weight: 1 };
                         const weight = meta.weight;
                         
                         if (!targetGroup.criteria_sum[cid]) {
                             targetGroup.criteria_sum[cid] = { name: meta.title, score: 0, max: 0 };
                         }
                        const rawScore = parseFloat(ev.scores_detail[cid] || 0);
                        targetGroup.criteria_sum[cid].score += (rawScore * weight);
                        targetGroup.criteria_sum[cid].max += (maxScale * weight);
                    });
                }
            });
            return grouped;
        }, [evaluations]);

        const roundKeys = Object.keys(rounds);
        const currentRoundData = activeRound === 'all' ? (roundKeys.length > 0 ? rounds[roundKeys[roundKeys.length-1]] : null) : rounds[activeRound];

        useEffect(() => {
            if (initialRound && roundKeys.includes(initialRound)) {
                setActiveRound(initialRound);
            } else if (activeRound === 'all' && roundKeys.length > 0 && !initialRound) {
                setActiveRound(roundKeys[roundKeys.length - 1]);
            }
        }, [initialRound, roundKeys]);

        if (roundKeys.length === 0) {
            return (
                <div className="text-center py-20 bg-white rounded-2xl border border-dashed border-gray-200 mt-4">
                    <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                        <Icons.Activity size={32}/>
                    </div>
                    <h3 className="text-gray-500 font-bold">ยังไม่มีผลการประเมิน</h3>
                    <p className="text-gray-400 text-sm">รอคุณครูและกรรมการประเมินสักครู่นะครับ</p>
                </div>
            );
        }

        return (
            <div className="p-4 pb-24 animate-fadeIn max-w-3xl mx-auto space-y-6">
                {/* Round Selector */}
                <div className="flex overflow-x-auto gap-2 pb-2 scrollbar-hide">
                    {roundKeys.map(r => (
                        <button 
                            key={r}
                            onClick={() => setActiveRound(r)}
                            className={`whitespace-nowrap px-4 py-2 rounded-full text-sm font-bold transition-all ${
                                activeRound === r 
                                ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' 
                                : 'bg-white text-gray-500 border border-gray-200 hover:bg-gray-50'
                            }`}
                        >
                             {r === 'proposal' ? '1. สอบหัวข้อ' : 
                             r === 'progress1' ? '2. ก้าวหน้า 1' :
                             r === 'progress2' ? '3. ก้าวหน้า 2' :
                             r === 'final' ? '4. สอบจบ' : 
                             r === 'sciencefair' ? '5. โปสเตอร์' : 
                             r === 'oral' ? '6. บรรยาย' : r}
                        </button>
                    ))}
                </div>

                {currentRoundData && (
                    <>
                        {/* ✅ SCORE SUMMARY CARDS (แยก 2 ฝั่ง) */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {/* บัตรคะแนนกรรมการ */}
                            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10"><Icons.Users size={100} /></div>
                                <div className="relative z-10">
                                    <h3 className="text-blue-200 text-sm font-bold uppercase tracking-wider mb-1">คะแนนจากกรรมการ</h3>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-5xl font-bold">
                                            {currentRoundData.committee.count > 0 ? (currentRoundData.committee.total_score / currentRoundData.committee.count).toFixed(2) : '-'}
                                        </span>
                                        {currentRoundData.committee.count > 0 && (
                                            <span className="text-blue-200 font-medium text-lg">/ {(currentRoundData.committee.total_full / currentRoundData.committee.count).toFixed(0)}</span>
                                        )}
                                    </div>
                                    <p className="text-xs text-blue-200 mt-2 bg-white/10 inline-block px-2 py-1 rounded-lg">ประเมินแล้ว {currentRoundData.committee.count} ท่าน</p>
                                </div>
                            </div>

                            {/* บัตรคะแนนที่ปรึกษา */}
                            <div className="bg-gradient-to-br from-purple-600 to-pink-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10"><Icons.User size={100} /></div>
                                <div className="relative z-10">
                                    <h3 className="text-purple-200 text-sm font-bold uppercase tracking-wider mb-1">คะแนนจากที่ปรึกษา</h3>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-5xl font-bold">
                                            {currentRoundData.advisor.count > 0 ? (currentRoundData.advisor.total_score / currentRoundData.advisor.count).toFixed(2) : '-'}
                                        </span>
                                        {currentRoundData.advisor.count > 0 && (
                                            <span className="text-purple-200 font-medium text-lg">/ {(currentRoundData.advisor.total_full / currentRoundData.advisor.count).toFixed(0)}</span>
                                        )}
                                    </div>
                                    <p className="text-xs text-purple-200 mt-2 bg-white/10 inline-block px-2 py-1 rounded-lg">ประเมินแล้ว {currentRoundData.advisor.count} ท่าน</p>
                                </div>
                            </div>
                        </div>

                        {/* ✅ CRITERIA BREAKDOWN: ฝั่งกรรมการ */}
                        {Object.keys(currentRoundData.committee.criteria_sum).length > 0 && (
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                                <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <Icons.Layout size={20} className="text-blue-500"/> วิเคราะห์รายหัวข้อ (กรรมการ)
                                </h3>
                                <div className="space-y-4">
                                    {Object.values(currentRoundData.committee.criteria_sum).map((c, i) => {
                                        const avgScore = c.score / currentRoundData.committee.count;
                                        const avgMax = c.max / currentRoundData.committee.count;
                                        const percent = avgMax > 0 ? (avgScore / avgMax) * 100 : 0;
                                        return (
                                            <div key={i}>
                                                <div className="flex justify-between text-xs mb-1 font-bold text-gray-600">
                                                    <span>{c.name}</span>
                                                    <span>{avgScore.toFixed(1)} / {avgMax.toFixed(0)}</span>
                                                </div>
                                                <div className="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                                                    <div className={`h-2.5 rounded-full transition-all duration-1000 ${percent >= 80 ? 'bg-green-500' : percent >= 50 ? 'bg-yellow-400' : 'bg-red-400'}`} style={{ width: `${percent}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* ✅ CRITERIA BREAKDOWN: ฝั่งที่ปรึกษา */}
                        {Object.keys(currentRoundData.advisor.criteria_sum).length > 0 && (
                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                                <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2">
                                    <Icons.Layout size={20} className="text-purple-500"/> วิเคราะห์รายหัวข้อ (ครูที่ปรึกษา)
                                </h3>
                                <div className="space-y-4">
                                    {Object.values(currentRoundData.advisor.criteria_sum).map((c, i) => {
                                        const avgScore = c.score / currentRoundData.advisor.count;
                                        const avgMax = c.max / currentRoundData.advisor.count;
                                        const percent = avgMax > 0 ? (avgScore / avgMax) * 100 : 0;
                                        return (
                                            <div key={i}>
                                                <div className="flex justify-between text-xs mb-1 font-bold text-gray-600">
                                                    <span>{c.name}</span>
                                                    <span>{avgScore.toFixed(1)} / {avgMax.toFixed(0)}</span>
                                                </div>
                                                <div className="w-full bg-gray-100 rounded-full h-2.5 overflow-hidden">
                                                    <div className={`h-2.5 rounded-full transition-all duration-1000 ${percent >= 80 ? 'bg-green-500' : percent >= 50 ? 'bg-yellow-400' : 'bg-red-400'}`} style={{ width: `${percent}%` }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Feedback Wall */}
                        {currentRoundData.feedbacks.length > 0 && (
                            <div>
                                <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2 px-2">
                                    <Icons.MessageSquare size={20} className="text-orange-500"/> ข้อเสนอแนะจากกรรมการ/ที่ปรึกษา
                                </h3>
                                <div className="grid gap-4 md:grid-cols-2">
                                    {currentRoundData.feedbacks.map((fb, i) => (
                                        <div key={i} className={`bg-white p-4 rounded-xl shadow-sm border relative group hover:shadow-md transition-all flex flex-col justify-between ${fb.role === 'advisor' ? 'border-purple-100' : 'border-blue-100'}`}>
                                            <div className="absolute top-4 left-4 text-gray-200 opacity-50"><Icons.MessageSquare size={24} /></div>
                                            
                                            <div className="relative z-10 pl-8 mb-4">
                                                <p className="text-gray-600 text-sm leading-relaxed italic">"{fb.text}"</p>
                                            </div>

                                            {/* Evaluator Profile Section */}
                                            <div className="relative z-10 flex items-center justify-end gap-3 mt-auto pt-3 border-t border-gray-50">
                                                <div className="text-right">
                                                    <span className={`block text-[10px] font-bold uppercase tracking-wider ${fb.role === 'advisor' ? 'text-purple-500' : 'text-blue-500'}`}>
                                                        {fb.role === 'advisor' ? 'ครูที่ปรึกษา' : 'กรรมการสอบ'}
                                                    </span>
                                                    <span className="block text-xs font-bold text-gray-700">{fb.evaluatorName}</span>
                                                </div>
                                                
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm overflow-hidden border-2 ${fb.role === 'advisor' ? 'bg-purple-100 text-purple-600 border-purple-100' : 'bg-blue-100 text-blue-600 border-blue-100'}`}>
                                                    {fb.evaluatorImage ? (
                                                        <img 
                                                            src={fb.evaluatorImage} 
                                                            className="w-full h-full object-cover" 
                                                            onError={(e) => {
                                                                e.target.style.display = 'none';
                                                                e.target.nextSibling.style.display = 'flex';
                                                            }}
                                                        />
                                                    ) : null}
                                                    <div className={`w-full h-full flex items-center justify-center ${fb.evaluatorImage ? 'hidden' : 'flex'}`}>
                                                        {fb.evaluatorName.charAt(0)}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </>
                )}
            </div>
        );
    };    

    // --- STUDENT: PROFILE TAB (Hidden Face ID Section) ---
    const ProfileTab = ({ user, onUpdateUser }) => {
    const [isEditing, setIsEditing] = useState(false);
    const [formData, setFormData] = useState({ ...user });
    const [newPassword, setNewPassword] = useState("");
    const [confirmPassword, setConfirmPassword] = useState("");
    const [isSaving, setIsSaving] = useState(false);
    // const [showScanner, setShowScanner] = useState(false); // ซ่อน State Scanner
    const fileInputRef = useRef(null);

    useEffect(() => { setFormData({...user}); }, [user]);
    
    const handleChange = (e) => { 
        const { name, value } = e.target; 
        setFormData(prev => ({ ...prev, [name]: value })); 
    };

    const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const result = await Swal.fire({ title: 'ยืนยันอัปโหลดรูป?', text: "รูปโปรไฟล์ใหม่จะถูกบันทึก", icon: 'question', showCancelButton: true, confirmButtonText: 'อัปโหลด', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#2563eb' });
        if (!result.isConfirmed) { if (fileInputRef.current) fileInputRef.current.value = ""; return; }
        const reader = new FileReader();
        reader.onloadend = async () => {
            setIsSaving(true);
            try {
                const result = await api.uploadImage(reader.result, file.type, String(user.username));
                if (result.success) {
                    const newUrl = result.url;
                    const updatedUser = { ...user, pictureprofileURL: newUrl };
                    setFormData(updatedUser);
                    onUpdateUser(updatedUser);
                    await api.updateProfile({ ...updatedUser, username: String(user.username) });
                    Swal.fire('สำเร็จ', 'อัปโหลดรูปโปรไฟล์เรียบร้อยแล้ว', 'success');
                } else { Swal.fire('ล้มเหลว', result.message, 'error'); }
            } catch(e) { Swal.fire('Error', 'Error uploading image', 'error'); }
            setIsSaving(false);
        };
        reader.readAsDataURL(file);
    };

    // ซ่อนฟังก์ชัน handleRegisterFace ไว้ก่อน
    /* const handleRegisterFace = async (descriptor) => { ... } 
    */

    const validatePassword = (pwd) => { const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/; return regex.test(pwd); };
    
    const handleSave = async () => {
        setIsSaving(true);
        if (newPassword) {
            if (newPassword !== confirmPassword) { Swal.fire('แจ้งเตือน', "รหัสผ่านใหม่ไม่ตรงกัน", 'warning'); setIsSaving(false); return; }
            if (!validatePassword(newPassword)) { Swal.fire('แจ้งเตือน', "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร (อังกฤษ+ตัวเลข)", 'warning'); setIsSaving(false); return; }
        }
        const payload = { ...formData, newPassword: newPassword || null, username: String(user.username) };
        if (!payload.username) { Swal.fire('Error', "ไม่พบ Username ของผู้ใช้", 'error'); setIsSaving(false); return; }
        try {
            const res = await api.updateProfile(payload);
            if (res.success) { Swal.fire('บันทึกสำเร็จ', 'ข้อมูลของคุณถูกอัปเดตแล้ว', 'success'); onUpdateUser(payload); setIsEditing(false); setNewPassword(""); setConfirmPassword(""); } 
            else { Swal.fire('เกิดข้อผิดพลาด', res.message, 'error'); }
        } catch (e) { Swal.fire('Error', "Error saving data", 'error'); }
        setIsSaving(false);
    };

    return (
        <div className="animate-fadeIn pb-24 px-4 pt-2">
            
            {/* ซ่อน Scanner Modal */}
            {/* {showScanner && <FaceScanner mode="register" onScan={handleRegisterFace} onCancel={() => setShowScanner(false)} />} */}

            <div className="flex justify-between items-center mb-4">
                <h2 className="text-xl font-bold text-gray-800">ข้อมูลส่วนตัว</h2>
                {!isEditing ? (
                    <button onClick={() => setIsEditing(true)} className="flex items-center gap-1 text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-100 transition-colors">
                        <Icons.Edit size={16} /> แก้ไข
                    </button>
                ) : (
                    <div className="flex gap-2">
                        <button onClick={() => setIsEditing(false)} className="text-gray-500 text-sm px-2 hover:text-gray-700">ยกเลิก</button>
                        <button onClick={handleSave} disabled={isSaving} className="flex items-center gap-1 text-white bg-blue-600 px-4 py-1.5 rounded-lg text-sm font-semibold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">
                            {isSaving ? <Icons.Loader2 className="spin" size={16}/> : <><Icons.Save size={16} /> บันทึก</>}
                        </button>
                    </div>
                )}
            </div>

            <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
                <div className="flex flex-col items-center mb-6 relative">
                    <div className="w-28 h-28 rounded-full border-4 border-white shadow-lg overflow-hidden relative group bg-gray-100">
                        <img src={formData.pictureprofileURL || `https://ui-avatars.com/api/?name=${user.username}`} className="w-full h-full object-cover" />
                        <div onClick={() => isEditing && fileInputRef.current.click()} className={`absolute inset-0 bg-black/40 flex flex-col items-center justify-center transition-opacity text-white cursor-pointer ${isEditing ? 'opacity-100' : 'opacity-0'}`}>
                            <Icons.Camera size={24} />
                            <span className="text-[10px] mt-1">เปลี่ยนรูป</span>
                        </div>
                    </div>
                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                    
                    <h3 className="text-lg font-bold mt-3 text-gray-800 text-center">
                        {formData.prefix ? formData.prefix : ''} {formData.firstname ? formData.firstname : ''} {formData.lastname ? formData.lastname : ''}
                        {(!formData.firstname && !formData.lastname) && <span className="text-gray-400 text-sm font-normal block">(ยังไม่ระบุชื่อ)</span>}
                    </h3>
                    <p className="text-gray-400 text-sm font-mono mt-1">
                        @{formData.username} 
                        <span className="bg-gray-100 text-gray-600 px-2 py-0.5 rounded text-[10px] uppercase ml-2 border border-gray-200">{user.role}</span>
                    </p>
                </div>

                {/* --- ส่วนปุ่ม Face ID ถูกลบออกไปแล้ว --- */}

                <div className="grid grid-cols-2 gap-4">
