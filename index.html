                    <InputField label="ชื่อเล่น" name="nickname" value={formData.nickname} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="ชื่อจริง" name="firstname" value={formData.firstname} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="นามสกุล" name="lastname" value={formData.lastname} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="ชั้นเรียน" name="classroom" value={formData.classroom} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="เลขที่" name="number" value={formData.number} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="วันเกิด" name="birthday" type="date" value={formData.birthday} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="เบอร์โทรศัพท์" name="telephone" type="tel" value={formData.telephone} onChange={handleChange} isEditing={isEditing} />
                </div>
            </div>

            <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4">
                <h3 className="font-bold text-gray-800 mb-4 flex items-center gap-2 border-b border-gray-50 pb-2">
                    <Icons.Home size={18} className="text-blue-500" /> โซเชียลมีเดีย
                </h3>
                <div className="space-y-2">
                    <InputField label="Line ID" name="line" value={formData.line} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="Facebook" name="facebook" value={formData.facebook} onChange={handleChange} isEditing={isEditing} />
                    <InputField label="Instagram" name="ig" value={formData.ig} onChange={handleChange} isEditing={isEditing} />
                </div>
            </div>

            {isEditing && (
                <div className="bg-red-50 rounded-2xl p-5 shadow-sm border border-red-100 mb-4">
                    <h3 className="font-bold text-red-600 mb-3 flex items-center gap-2">
                        <Icons.Lock size={18} /> เปลี่ยนรหัสผ่าน
                    </h3>
                    <div className="space-y-3">
                        <input type="password" placeholder="รหัสผ่านใหม่" value={newPassword} onChange={e => setNewPassword(e.target.value)} className="w-full p-2.5 rounded-xl border border-red-200 focus:ring-2 focus:ring-red-200 bg-white" />
                        <input type="password" placeholder="ยืนยันรหัสผ่านใหม่" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="w-full p-2.5 rounded-xl border border-red-200 focus:ring-2 focus:ring-red-200 bg-white" />
                        <p className="text-[10px] text-red-400 flex items-center gap-1">
                            <Icons.AlertCircle size={10} /> ต้องมีอย่างน้อย 8 ตัวอักษร (อังกฤษ+ตัวเลข)
                        </p>
                    </div>
                </div>
            )}
        </div>
    );
};

// --- COMPONENT: STUDENT AWARD TAB (FIXED ICONS SCOPE & DETAIL VIEW) ---
const StudentAwardTab = ({ user, project }) => {
  const [awards, setAwards] = React.useState([]);
  const [hashtags, setHashtags] = React.useState([]);
  
  // viewMode: 'list', 'form', 'detail'
  const [viewMode, setViewMode] = React.useState('list'); 
  const [selectedAward, setSelectedAward] = React.useState(null);
  
  const [loading, setLoading] = React.useState(false);
  const [processingMsg, setProcessingMsg] = React.useState('');

  // --- INTERNAL ICONS (ประกาศไว้บนสุด เพื่อให้เรียกใช้ได้ทุกจุด) ---
  const IconTrophy = () => <svg className="w-8 h-8 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg>;
  const IconPlus = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>;
  const IconLoader = () => <svg className="animate-spin h-10 w-10 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>;
  const IconMapPin = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>;
  const IconChevronLeft = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>;
  const IconFileText = () => <svg className="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>;
  const IconCalendar = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
  const IconEdit = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>;


  // --- Helper: ดึง Project ID ---
  const getProjectId = () => {
      if (!project) return null;
      return project.id || project.pj_ID || project.project_id;
  };
  
  const getProjectName = () => {
      if (!project) return '';
      return project.name || project.pj_name || project.project_name;
  };

  // --- Form State ---
  const initialForm = {
    award_id: '',
    award_name: '',
    award_level: 'ระดับโรงเรียน',
    organization: '',
    received_date: '',
    hashtags: [],
    existing_cert_id: '', 
    existing_cert_type: '',
    existing_photo_ids: [] 
  };
  
  const [formData, setFormData] = React.useState(initialForm);
  const [hashtagInput, setHashtagInput] = React.useState('');

  // --- File Pending State ---
  const [newCertFile, setNewCertFile] = React.useState(null);
  const [certPreview, setCertPreview] = React.useState(null);
  const [newTeamFiles, setNewTeamFiles] = React.useState([]);
  const [teamPreviews, setTeamPreviews] = React.useState([]);

  React.useEffect(() => {
    fetchAwards();
    fetchHashtags();
    return () => {
        if(certPreview) URL.revokeObjectURL(certPreview);
        teamPreviews.forEach(url => URL.revokeObjectURL(url));
    };
  }, [project]);

  const fetchAwards = () => {
    const pid = getProjectId();
    if(!pid) return;
    setLoading(true);
    google.script.run.withSuccessHandler(data => {
      setAwards(data);
      setLoading(false);
    }).getAwards('student', user.username);
  };

  const fetchHashtags = () => {
    google.script.run.withSuccessHandler(data => {
      setHashtags(data);
    }).getHashtags();
  };

  const uploadFileToDrive = (file, projectId, type) => {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const payload = {
                base64: e.target.result.split(',')[1],
                mimeType: file.type,
                fileName: file.name
            };
            google.script.run
                .withSuccessHandler(res => { if (res.success) resolve(res); else reject(res.message); })
                .withFailureHandler(err => reject(err))
                .uploadAwardEvidence(payload, projectId, type);
        };
        reader.onerror = error => reject(error);
    });
  };

  // --- Handlers ---
  const handleEdit = (award) => {
    setFormData({
      award_id: award.award_id,
      award_name: award.award_name,
      award_level: award.award_level,
      organization: award.organization,
      received_date: award.received_date ? award.received_date.replace(/'/g, '') : '', 
      hashtags: award.hashtags || [],
      existing_cert_id: award.cert_file_id,
      existing_cert_type: award.cert_file_type,
      existing_photo_ids: award.team_photos || []
    });
    setNewCertFile(null); setCertPreview(null);
    setNewTeamFiles([]); setTeamPreviews([]);
    setViewMode('form');
  };

  const handleViewDetail = (award) => {
    setSelectedAward(award);
    setViewMode('detail');
  };

  const resetForm = () => {
    setFormData(initialForm);
    setNewCertFile(null); setCertPreview(null);
    setNewTeamFiles([]); setTeamPreviews([]);
    setProcessingMsg('');
  };

  const handleCertSelect = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setNewCertFile(file);
      setCertPreview(URL.createObjectURL(file));
  };

  const handleTeamSelect = (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;
      if ((formData.existing_photo_ids.length + newTeamFiles.length + files.length) > 5) {
          Swal.fire('แจ้งเตือน', 'สามารถใส่รูปได้สูงสุด 5 รูป', 'warning');
          return;
      }
      setNewTeamFiles(prev => [...prev, ...files]);
      const newUrls = files.map(f => URL.createObjectURL(f));
      setTeamPreviews(prev => [...prev, ...newUrls]);
  };

  const removeNewTeamPhoto = (index) => {
      setNewTeamFiles(prev => prev.filter((_, i) => i !== index));
      setTeamPreviews(prev => prev.filter((_, i) => i !== index));
  };
  
  const removeExistingPhoto = (photoId) => {
      setFormData(prev => ({ ...prev, existing_photo_ids: prev.existing_photo_ids.filter(id => id !== photoId) }));
  };

  const handleAddHashtag = (tag) => {
    if(!tag) return;
    const cleanTag = tag.startsWith('#') ? tag : '#' + tag;
    if (!formData.hashtags.includes(cleanTag)) {
      setFormData(prev => ({ ...prev, hashtags: [...prev.hashtags, cleanTag] }));
    }
    setHashtagInput('');
  };

  const handleSubmit = async () => {
      const pid = getProjectId();
      if (!pid) return Swal.fire('Error', 'ไม่พบรหัสโครงงาน (Project ID)', 'error');
      
      if (!formData.award_name) return Swal.fire('เตือน', 'กรุณากรอกชื่อรางวัล', 'warning');
      if (!formData.existing_cert_id && !newCertFile) return Swal.fire('เตือน', 'กรุณาอัปโหลดเกียรติบัตร', 'warning');

      setLoading(true);
      setProcessingMsg('กำลังเตรียมข้อมูล...');

      try {
          let finalCertId = formData.existing_cert_id;
          let finalCertType = formData.existing_cert_type;
          let finalTeamIds = [...formData.existing_photo_ids];

          if (newCertFile) {
              setProcessingMsg('กำลังอัปโหลดเกียรติบัตร...');
              const res = await uploadFileToDrive(newCertFile, pid, 'cert');
              finalCertId = res.fileId;
              finalCertType = newCertFile.type.includes('pdf') ? 'pdf' : 'image';
          }

          if (newTeamFiles.length > 0) {
              for (let i = 0; i < newTeamFiles.length; i++) {
                  setProcessingMsg(`กำลังอัปโหลดรูปทีม (${i + 1}/${newTeamFiles.length})...`);
                  const res = await uploadFileToDrive(newTeamFiles[i], pid, 'photo');
                  finalTeamIds.push(res.fileId);
              }
          }

          setProcessingMsg('กำลังบันทึกข้อมูล...');
          const payload = {
              award_id: formData.award_id,
              project_id: pid,
              project_name: getProjectName(),
              student_username: user.username,
              award_name: formData.award_name,
              award_level: formData.award_level,
              organization: formData.organization,
              received_date: formData.received_date,
              cert_file_id: finalCertId,
              cert_file_type: finalCertType,
              team_photos: finalTeamIds,
              hashtags: formData.hashtags
          };

          google.script.run.withSuccessHandler(res => {
              setLoading(false); setProcessingMsg('');
              if (res.success) {
                  Swal.fire('สำเร็จ', 'บันทึกข้อมูลรางวัลเรียบร้อย', 'success');
                  fetchAwards(); fetchHashtags(); setViewMode('list');
              } else { Swal.fire('ผิดพลาด', res.message, 'error'); }
          }).saveAward(payload);

      } catch (error) {
          console.error(error); setLoading(false); setProcessingMsg('');
          Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถอัปโหลดไฟล์หรือบันทึกข้อมูลได้', 'error');
      }
  };
  
  const handleDelete = (id) => {
    Swal.fire({
      title: 'ยืนยันการลบ?', text: "ต้องการลบรายการนี้ใช่หรือไม่", icon: 'warning',
      showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก'
    }).then((result) => {
      if (result.isConfirmed) {
        google.script.run.withSuccessHandler(res => {
          if(res.success) { Swal.fire('Deleted!', 'ลบเรียบร้อย', 'success'); fetchAwards(); } 
          else { Swal.fire('Error', res.message, 'error'); }
        }).deleteAward(id, user.username);
      }
    });
  };

  // --- RENDER ---
  
  // 1. DETAIL VIEW (หน้าแสดงรายละเอียด)
  if (viewMode === 'detail' && selectedAward) {
      return (
        <div className="p-6 animate-fade-in max-w-4xl mx-auto space-y-6">
            {/* Header: ปุ่มย้อนกลับ & หัวข้อ */}
            <div className="flex items-center gap-2">
                <button onClick={() => setViewMode('list')} className="p-2 hover:bg-gray-100 rounded-full transition text-gray-500">
                    <IconChevronLeft />
                </button>
                <h2 className="text-2xl font-bold text-gray-800">รายละเอียดรางวัล</h2>
            </div>

            <div className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
                {/* Status Bar */}
                <div className={`px-6 py-2 text-sm font-bold text-white flex justify-between items-center
                    ${selectedAward.status === 'approved' ? 'bg-green-500' : 
                      selectedAward.status === 'rejected' ? 'bg-red-500' : 'bg-yellow-500'}`}>
                    <span>สถานะ: {selectedAward.status.toUpperCase()}</span>
                    <span>{selectedAward.received_date}</span>
                </div>

                <div className="p-6 md:p-8 space-y-8">
                    {/* Award Info */}
                    <div className="text-center">
                         <div className="inline-block p-3 bg-yellow-100 rounded-full mb-3 text-yellow-600">
                             <IconTrophy />
                         </div>
                         <h1 className="text-3xl font-bold text-gray-800 mb-2">{selectedAward.award_name}</h1>
                         <p className="text-xl text-blue-600 font-medium">{selectedAward.award_level}</p>
                         <p className="text-gray-500 flex items-center justify-center gap-2 mt-2">
                             <IconMapPin /> {selectedAward.organization}
                         </p>
                         {/* Hashtags */}
                         <div className="mt-4 flex flex-wrap justify-center gap-2">
                            {selectedAward.hashtags.map((t, i) => (
                                <span key={i} className="text-sm bg-gray-100 text-gray-600 px-3 py-1 rounded-full">{t}</span>
                            ))}
                         </div>
                    </div>
                    
                    {/* Feedback if Rejected */}
                    {selectedAward.status === 'rejected' && selectedAward.feedback && (
                        <div className="bg-red-50 p-4 rounded-xl border border-red-200 text-red-700 text-center">
                            <strong>Feedback:</strong> {selectedAward.feedback}
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* Certificate Preview */}
                        <div className="space-y-3">
                            <h3 className="font-bold text-gray-700 border-l-4 border-blue-500 pl-3">เกียรติบัตร</h3>
                            <div className="border rounded-xl overflow-hidden shadow-sm bg-gray-50 h-80 flex items-center justify-center">
                                {selectedAward.cert_file_type === 'image' ? (
                                    <img src={`https://lh3.googleusercontent.com/d/${selectedAward.cert_file_id}`} 
                                         className="max-w-full max-h-full object-contain" alt="Certificate"/>
                                ) : (
                                    <iframe src={`https://drive.google.com/file/d/${selectedAward.cert_file_id}/preview`} 
                                            className="w-full h-full" allow="autoplay"></iframe>
                                )}
                            </div>
                        </div>

                        {/* Team Photos Gallery */}
                        <div className="space-y-3">
                            <h3 className="font-bold text-gray-700 border-l-4 border-purple-500 pl-3">ภาพกิจกรรม ({selectedAward.team_photos.length})</h3>
                            {selectedAward.team_photos.length > 0 ? (
                                <div className="grid grid-cols-2 gap-2 h-80 overflow-y-auto content-start pr-1">
                                    {selectedAward.team_photos.map((pid, idx) => (
                                        <div key={idx} className="relative group aspect-square rounded-lg overflow-hidden border border-gray-200 cursor-pointer">
                                            <img src={`https://lh3.googleusercontent.com/d/${pid}`} 
                                                 className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300"
                                                 alt="Activity" />
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="h-80 flex flex-col items-center justify-center bg-gray-50 rounded-xl text-gray-400 border border-dashed">
                                    <div className="text-4xl mb-2">📷</div>
                                    <p>ไม่มีรูปภาพกิจกรรม</p>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Footer Actions */}
                    <div className="flex justify-center pt-6 border-t border-gray-100">
                         {(selectedAward.status === 'pending' || selectedAward.status === 'rejected') && (
                             <button onClick={() => handleEdit(selectedAward)} 
                                className="bg-yellow-500 hover:bg-yellow-600 text-white px-8 py-2 rounded-lg shadow font-medium transition flex items-center gap-2">
                                <IconEdit /> แก้ไขข้อมูล / ส่งใหม่
                             </button>
                         )}
                    </div>
                </div>
            </div>
        </div>
      );
  }

  // 2. LIST VIEW
  if (viewMode === 'list') {
    return (
      <div className="p-6 space-y-6 animate-fade-in">
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
            <IconTrophy /> รางวัลของฉัน
          </h2>
          <button onClick={() => { resetForm(); setViewMode('form'); }} 
            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow flex items-center gap-2 transition">
            <IconPlus /> <span>เพิ่มรางวัล</span>
          </button>
        </div>

        {loading ? (
            <div className="text-center py-10"><IconLoader /></div>
        ) : awards.length === 0 ? (
            <div className="text-center py-10 text-gray-500 bg-gray-50 rounded-xl border border-dashed border-gray-300">
               <div className="mx-auto text-gray-400 mb-2 w-12 h-12 flex justify-center items-center"><IconTrophy /></div>
               ยังไม่มีข้อมูลรางวัล กดปุ่ม "เพิ่มรางวัล" เพื่อเริ่มบันทึก
            </div>
        ) : (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {awards.map((award, idx) => (
              <div key={idx} className="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 relative group hover:shadow-lg transition">
                <div className={`absolute top-2 right-2 px-2 py-1 rounded text-xs font-bold uppercase tracking-wider
                  ${award.status === 'approved' ? 'bg-green-100 text-green-800' : 
                    award.status === 'rejected' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800'}`}>
                  {award.status}
                </div>
                
                {/* Content: คลิกเพื่อดูรายละเอียด */}
                <div className="p-5 cursor-pointer" onClick={() => handleViewDetail(award)}>
                   <h3 className="text-lg font-bold text-gray-800 mb-1 hover:text-blue-600 transition">{award.award_name}</h3>
                   <div className="text-sm text-blue-600 font-medium mb-2">{award.award_level}</div>
                   <p className="text-sm text-gray-600 flex items-center gap-1"><IconMapPin /> {award.organization}</p>
                   <p className="text-sm text-gray-500 mt-1 flex items-center gap-1"><IconCalendar /> {award.received_date}</p>
                   
                   {award.status === 'rejected' && award.feedback && (
                     <div className="mt-3 bg-red-50 p-3 rounded text-sm text-red-700 border-l-4 border-red-500">
                        <strong>แก้ไข:</strong> {award.feedback}
                     </div>
                   )}

                   <div className="mt-3 flex flex-wrap gap-1">
                     {award.hashtags.map((t, i) => <span key={i} className="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">{t}</span>)}
                   </div>
                   
                   {/* Hint for clickable */}
                   <div className="mt-2 text-xs text-gray-400 text-right">คลิกเพื่อดูรายละเอียด &rarr;</div>
                </div>

                {/* Actions */}
                {(award.status === 'pending' || award.status === 'rejected') && (
                   <div className="bg-gray-50 px-5 py-3 border-t border-gray-100 flex justify-end gap-2">
                      <button onClick={(e) => { e.stopPropagation(); handleDelete(award.award_id); }} className="text-red-600 hover:text-red-800 text-sm font-medium px-2 py-1 rounded hover:bg-red-50 transition">ลบ</button>
                      <button onClick={(e) => { e.stopPropagation(); handleEdit(award); }} className="bg-yellow-500 hover:bg-yellow-600 text-white text-sm font-medium px-3 py-1 rounded transition">แก้ไข</button>
                   </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  // 3. FORM VIEW
  return (
    <div className="p-6 animate-fade-in max-w-3xl mx-auto">
      <div className="flex items-center gap-2 mb-6">
        <button onClick={() => setViewMode('list')} className="p-2 hover:bg-gray-100 rounded-full transition text-gray-500">
           <IconChevronLeft />
        </button>
        <h2 className="text-2xl font-bold text-gray-800">{formData.award_id ? 'แก้ไขรางวัล' : 'เพิ่มรางวัลใหม่'}</h2>
      </div>

      <div className="space-y-6 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
         <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
               <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อรางวัล *</label>
               <input type="text" className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none" 
                  value={formData.award_name} onChange={e => setFormData({...formData, award_name: e.target.value})} />
            </div>
            <div>
               <label className="block text-sm font-medium text-gray-700 mb-1">ระดับรางวัล</label>
               <select className="w-full border rounded-lg p-2 bg-white"
                  value={formData.award_level} onChange={e => setFormData({...formData, award_level: e.target.value})}>
                  <option>ระดับโรงเรียน</option>
                  <option>ระดับเขตพื้นที่/จังหวัด</option>
                  <option>ระดับภูมิภาค</option>
                  <option>ระดับประเทศ</option>
                  <option>ระดับนานาชาติ</option>
               </select>
            </div>
            <div>
               <label className="block text-sm font-medium text-gray-700 mb-1">หน่วยงานที่จัด</label>
               <input type="text" className="w-full border rounded-lg p-2" 
                  value={formData.organization} onChange={e => setFormData({...formData, organization: e.target.value})} />
            </div>
            <div>
               <label className="block text-sm font-medium text-gray-700 mb-1">วันที่ได้รับ</label>
               <input type="date" className="w-full border rounded-lg p-2" 
                  value={formData.received_date} onChange={e => setFormData({...formData, received_date: e.target.value})} />
            </div>
         </div>

         <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Hashtag</label>
            <div className="flex gap-2 mb-2">
               <input type="text" className="flex-1 border rounded-lg p-2" placeholder="#ทีมโครงงานสุดเจ๋ง"
                  value={hashtagInput} onChange={e => setHashtagInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleAddHashtag(hashtagInput)} />
               <button onClick={() => handleAddHashtag(hashtagInput)} className="bg-gray-200 hover:bg-gray-300 px-4 rounded-lg text-gray-700">Add</button>
            </div>
            {hashtagInput && (
              <div className="flex flex-wrap gap-2 mb-2 p-2 bg-gray-50 rounded text-sm">
                 <span className="text-gray-400 text-xs mr-1">แนะนำ:</span>
                 {hashtags.filter(t => t.text.toLowerCase().includes(hashtagInput.toLowerCase())).slice(0, 5).map((t, i) => (
                    <button key={i} onClick={() => handleAddHashtag(t.text)} className="text-blue-600 hover:underline">{t.text} ({t.count})</button>
                 ))}
              </div>
            )}
            <div className="flex flex-wrap gap-2">
               {formData.hashtags.map((tag, idx) => (
                  <span key={idx} className="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-sm flex items-center gap-1">
                     {tag} <button onClick={() => setFormData(prev => ({...prev, hashtags: prev.hashtags.filter(t => t !== tag)}))} className="hover:text-blue-900 font-bold">×</button>
                  </span>
               ))}
            </div>
         </div>

         <div className="border-t pt-4">
            <label className="block text-sm font-medium text-gray-700 mb-2">รูปเกียรติบัตร (Image หรือ PDF) *</label>
            {newCertFile ? (
                <div className="relative border rounded-lg p-2 bg-blue-50">
                    <div className="flex justify-between items-center mb-2">
                         <span className="text-sm font-bold text-blue-600">ไฟล์ใหม่: {newCertFile.name}</span>
                         <button onClick={() => { setNewCertFile(null); setCertPreview(null); }} className="text-red-500 text-xs hover:underline">ยกเลิก</button>
                    </div>
                    {newCertFile.type.includes('pdf') ? (
                        <div className="h-40 flex items-center justify-center bg-white border rounded text-gray-500"><IconFileText /> PDF Preview Unavailable</div>
                    ) : (
                        <img src={certPreview} className="max-h-60 mx-auto rounded shadow" />
                    )}
                </div>
            ) : formData.existing_cert_id ? ( 
                <div className="relative border rounded-lg p-2 bg-gray-50">
                    <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-bold text-green-600">✓ มีไฟล์เดิมแล้ว</span>
                        <button onClick={() => setFormData(prev => ({...prev, existing_cert_id: '', existing_cert_type: ''}))} className="text-red-500 text-xs hover:underline">ลบ/เปลี่ยนไฟล์</button>
                    </div>
                    {formData.existing_cert_type === 'image' ? (
                        <img src={`https://lh3.googleusercontent.com/d/${formData.existing_cert_id}`} className="max-h-60 mx-auto rounded shadow" />
                    ) : (
                        <iframe src={`https://drive.google.com/file/d/${formData.existing_cert_id}/preview`} className="w-full h-60 border rounded" allow="autoplay"></iframe>
                    )}
                </div>
            ) : (
                <input type="file" accept="image/*,application/pdf" onChange={handleCertSelect} 
                  className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            )}
         </div>

         <div>
            <label className="block text-sm font-medium text-gray-700 mb-2">รูปทีมคู่กับรางวัล (สูงสุด 5 รูป)</label>
            <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-2">
               {formData.existing_photo_ids.map((pid, idx) => (
                  <div key={`old-${idx}`} className="relative group">
                     <img src={`https://lh3.googleusercontent.com/d/${pid}`} className="w-full h-24 object-cover rounded shadow border-2 border-green-500" />
                     <button onClick={() => removeExistingPhoto(pid)} className="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition">×</button>
                  </div>
               ))}
               
               {teamPreviews.map((url, idx) => (
                   <div key={`new-${idx}`} className="relative group">
                       <img src={url} className="w-full h-24 object-cover rounded shadow border-2 border-blue-500" />
                       <div className="absolute bottom-0 right-0 bg-blue-500 text-white text-[10px] px-1 rounded-tl">New</div>
                       <button onClick={() => removeNewTeamPhoto(idx)} className="absolute top-0 right-0 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition">×</button>
                   </div>
               ))}

               {(formData.existing_photo_ids.length + newTeamFiles.length) < 5 && (
                  <label className="w-full h-24 border-2 border-dashed border-gray-300 rounded flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
                     <IconPlus />
                     <span className="text-xs text-gray-500">เพิ่มรูป</span>
                     <input type="file" accept="image/*" multiple className="hidden" onChange={handleTeamSelect} />
                  </label>
               )}
            </div>
         </div>

         <div className="flex justify-between items-center pt-4 border-t">
            <span className="text-sm text-blue-600 font-medium animate-pulse">{processingMsg}</span>
            <div className="flex gap-3">
                <button onClick={() => { resetForm(); setViewMode('list'); }} disabled={loading} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">ยกเลิก</button>
                <button onClick={handleSubmit} disabled={loading} className={`px-6 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition ${loading ? 'opacity-50 cursor-not-allowed' : ''}`}>
                {loading ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}
                </button>
            </div>
         </div>
      </div>
    </div>
  );
};


// --- COMPONENT: STUDENT FEED (With Fullscreen Image) ---
const StudentFeed = ({ user }) => {
    const [posts, setPosts] = React.useState([]);
    const [socialData, setSocialData] = React.useState({ likes: {}, comments: {} });
    const [userMap, setUserMap] = React.useState({}); // ✅ เพิ่ม map user
    const [loading, setLoading] = React.useState(true);
    
    // Interaction States
    const [openComments, setOpenComments] = React.useState(null);
    const [commentText, setCommentText] = React.useState('');
    const [applyModal, setApplyModal] = React.useState(null);
    const [applyForm, setApplyForm] = React.useState({});
    const [previewImageId, setPreviewImageId] = React.useState(null); // ✅ [NEW]

    // --- UTILS: Skeleton ---
    const Skeleton = ({ className }) => (<div className={`animate-pulse bg-gray-200 rounded ${className}`}></div>);
    const PostSkeleton = () => (<div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden p-4 space-y-4"><div className="flex items-center gap-3"><Skeleton className="w-10 h-10 rounded-full" /><div className="space-y-2"><Skeleton className="w-32 h-4" /><Skeleton className="w-20 h-3" /></div></div><div className="space-y-2"><Skeleton className="w-3/4 h-6" /><div className="space-y-1 pt-2"><Skeleton className="w-full h-4" /><Skeleton className="w-full h-4" /><Skeleton className="w-2/3 h-4" /></div></div><Skeleton className="w-full h-48 rounded-xl" /><div className="flex justify-between pt-2 border-t border-gray-50"><Skeleton className="w-20 h-8" /><Skeleton className="w-20 h-8" /></div></div>);

    // --- ICONS ---
    const Icons = {
        ThumbUp: ({filled}) => <svg className={`w-5 h-5 ${filled ? 'text-blue-600 fill-current' : 'text-gray-500'}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>,
        Comment: () => <svg className="w-5 h-5 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
        Send: () => <svg className="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
        X: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
    };

    React.useEffect(() => { loadFeed(); }, []);

    const loadFeed = async () => {
        setLoading(true);
        try {
            const [resPosts, resSocial, resUsers] = await Promise.all([
                api.getPosts('all'),
                api.getSocialData(),
                api.getUserNameMap() // ✅ Load user info
            ]);
            setPosts(resPosts); setSocialData(resSocial); setUserMap(resUsers);
        } catch(e) { console.error(e); }
        setLoading(false);
    };

    const handleLike = async (postId) => {
        setSocialData(prev => {
            const likes = prev.likes[postId] || [];
            const isLiked = likes.includes(user.username);
            const newLikes = isLiked ? likes.filter(u => u !== user.username) : [...likes, user.username];
            return { ...prev, likes: { ...prev.likes, [postId]: newLikes } };
        });
        await api.toggleLike(postId, user.username);
    };

    const handleComment = async (postId) => {
        if(!commentText.trim()) return;
        const newComment = { id: Date.now(), username: user.username, text: commentText, timestamp: 'Just now' };
        setSocialData(prev => ({ ...prev, comments: { ...prev.comments, [postId]: [...(prev.comments[postId] || []), newComment] } }));
        setCommentText('');
        await api.addComment(postId, user.username, commentText);
    };

    const handleApply = async () => {
        const missing = applyModal.form_config.filter(f => f.required && !applyForm[f.label]);
        if(missing.length > 0) return Swal.fire('ข้อมูลไม่ครบ', `กรุณากรอก: ${missing.map(m=>m.label).join(', ')}`, 'warning');
        try {
            await api.submitRegistration(applyModal.post_id, user.username, JSON.stringify(applyForm));
            Swal.fire('สำเร็จ', 'สมัครเรียบร้อย!', 'success');
            setApplyModal(null); setApplyForm({});
        } catch(e) { Swal.fire('Error', e.toString(), 'error'); }
    };

    React.useEffect(() => {
        if(applyModal) {
            const autoField = applyModal.form_config.find(f => f.type === 'auto_project');
            if(autoField) setApplyForm(prev => ({ ...prev, [autoField.label]: user.project_name || "โครงงานของฉัน" }));
        }
    }, [applyModal, user]);

    return (
        <div className="max-w-2xl mx-auto p-4 pb-24 space-y-6 animate-fadeIn">
            {loading ? <><PostSkeleton /><PostSkeleton /></> : posts.length === 0 ? <div className="text-center py-10 text-gray-400">ไม่มีข่าวสารล่าสุด</div> : posts.map(post => {
                const likes = socialData.likes[post.post_id] || [];
                const comments = socialData.comments[post.post_id] || [];
                const isLiked = likes.includes(user.username);

                return (
                    <div key={post.post_id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="p-4 flex items-center gap-3"><div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-white ${post.type === 'news' ? 'bg-blue-500' : 'bg-orange-500'}`}>{post.type === 'news' ? 'N' : 'R'}</div><div><h3 className="font-bold text-gray-800 leading-tight">{post.type === 'news' ? 'ประกาศข่าวสาร' : 'รับสมัครแข่งขัน'}</h3><p className="text-xs text-gray-500">{post.timestamp}</p></div></div>
                        <div className="px-4 pb-2"><h2 className="text-lg font-bold text-gray-900 mb-1">{post.title}</h2>{post.subtitle && <p className="text-sm font-medium text-gray-600 mb-2">{post.subtitle}</p>}<p className="text-sm text-gray-700 whitespace-pre-wrap">{post.content}</p>{post.hashtags && post.hashtags.length > 0 && (<div className="mt-2 flex flex-wrap gap-1">{post.hashtags.map((h, i) => <span key={i} className="text-blue-600 text-xs hover:underline cursor-pointer">{h}</span>)}</div>)}</div>
                        
                        {/* ✅ IMAGE GRID (With Preview) */}
                        {post.images && post.images.length > 0 && (
                            <div className={`mt-2 px-4 pb-4 grid gap-1 ${post.images.length === 1 ? 'grid-cols-1' : post.images.length === 2 ? 'grid-cols-2' : 'grid-cols-2 md:grid-cols-3'}`}>
                                {post.images.map((imgId, idx) => (
                                    <img key={idx} 
                                        src={`https://lh3.googleusercontent.com/d/${imgId}`} 
                                        onError={(e) => { e.target.onerror = null; e.target.src = `https://lh3.googleusercontent.com/d/${imgId}`; }}
                                        onClick={() => setPreviewImageId(imgId)}
                                        className={`w-full object-cover rounded-lg border border-gray-100 cursor-pointer hover:opacity-90 transition ${post.images.length === 1 ? 'h-64' : 'h-40'}`} 
                                    />
                                ))}
                            </div>
                        )}

                        {post.type === 'recruitment' && (<div className="px-4 pb-4"><div className="bg-orange-50 p-4 rounded-xl border border-orange-100"><div className="flex justify-between items-center mb-3"><span className="text-xs font-bold text-orange-600 bg-orange-100 px-2 py-1 rounded">เปิดรับสมัคร</span><span className="text-xs text-gray-500">{post.organization}</span></div><button onClick={() => setApplyModal(post)} className="w-full py-2.5 bg-orange-600 text-white font-bold rounded-lg shadow hover:bg-orange-700 transition active:scale-95">สมัครเข้าร่วมทันที</button></div></div>)}
                        <div className="px-4 py-2 border-t border-gray-100 flex items-center justify-between text-gray-500 text-sm"><span>{likes.length} ถูกใจ</span><span>{comments.length} ความคิดเห็น</span></div>
                        <div className="px-2 border-t border-gray-100 flex"><button onClick={() => handleLike(post.post_id)} className={`flex-1 py-2 flex items-center justify-center gap-2 hover:bg-gray-50 rounded-lg transition ${isLiked ? 'text-blue-600 font-bold' : 'text-gray-600'}`}><Icons.ThumbUp filled={isLiked} /> ถูกใจ</button><button onClick={() => setOpenComments(openComments === post.post_id ? null : post.post_id)} className="flex-1 py-2 flex items-center justify-center gap-2 hover:bg-gray-50 rounded-lg text-gray-600 transition"><Icons.Comment /> คอมเมนต์</button></div>
                        {openComments === post.post_id && (
                            <div className="bg-gray-50 p-4 border-t border-gray-100 animate-fadeIn">
                                <div className="space-y-3 mb-4 max-h-60 overflow-y-auto">
                                    {comments.map((c, i) => {
                                        const author = userMap[c.username] || { name: c.username, image: null };
                                        return (
                                            <div key={i} className="flex gap-2">
                                                <div className="flex-shrink-0">{author.image ? <img src={author.image} className="w-8 h-8 rounded-full object-cover border border-gray-200" onError={(e)=>e.target.style.display='none'}/> : <div className="w-8 h-8 bg-gray-300 rounded-full flex items-center justify-center text-xs font-bold text-white">{author.name.charAt(0)}</div>}</div>
                                                <div className="bg-white p-2.5 rounded-2xl rounded-tl-none shadow-sm border border-gray-200 text-sm"><span className="font-bold text-gray-900 block text-xs">{author.name}</span><span className="text-gray-700">{c.text}</span></div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="flex gap-2"><input type="text" placeholder="เขียนความคิดเห็น..." className="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-blue-500" value={commentText} onChange={e => setCommentText(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleComment(post.post_id)} /><button onClick={() => handleComment(post.post_id)} className="bg-blue-600 text-white p-2 rounded-full hover:bg-blue-700"><Icons.Send /></button></div>
                            </div>
                        )}
                    </div>
                );
            })}

            {/* ✅ FULLSCREEN IMAGE MODAL */}
            {previewImageId && (
                <div className="fixed inset-0 z-[300] bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm animate-fadeIn" onClick={() => setPreviewImageId(null)}>
                    <button className="absolute top-5 right-5 text-white/70 hover:text-white transition"><Icons.X /></button>
                    <img 
                        src={`https://googleusercontent.com/profile/picture/1${previewImageId}`} 
                        onError={(e) => { e.target.onerror = null; e.target.src = `https://drive.google.com/uc?export=view&id=${previewImageId}`; }}
                        className="max-w-full max-h-full object-contain rounded-lg shadow-2xl"
                        onClick={e => e.stopPropagation()}
                    />
                </div>
            )}

            {applyModal && (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" onClick={() => setApplyModal(null)}>
                    <div className="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl animate-scaleIn" onClick={e => e.stopPropagation()}>
                        <div className="bg-orange-50 p-4 border-b border-orange-100 flex justify-between items-center"><h3 className="font-bold text-orange-900">ฟอร์มสมัคร: {applyModal.title}</h3><button onClick={() => setApplyModal(null)} className="text-orange-400 hover:text-orange-600"><Icons.X /></button></div>
                        <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">{applyModal.form_config.map((field) => (<div key={field.id}><label className="block text-sm font-bold text-gray-700 mb-1">{field.label}</label>{field.type === 'text' || field.type === 'auto_project' ? (<input type="text" className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-orange-500 outline-none disabled:bg-gray-100 disabled:text-gray-500" value={applyForm[field.label] || ''} onChange={e => setApplyForm({...applyForm, [field.label]: e.target.value})} disabled={field.type === 'auto_project'} />) : field.type === 'dropdown' ? (<select className="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-orange-500 outline-none bg-white" value={applyForm[field.label] || ''} onChange={e => setApplyForm({...applyForm, [field.label]: e.target.value})}><option value="">-- เลือก --</option>{field.options.split(',').map((opt, i) => <option key={i} value={opt.trim()}>{opt.trim()}</option>)}</select>) : null}</div>))}<button onClick={handleApply} className="w-full py-3 bg-orange-600 text-white rounded-xl font-bold shadow-lg hover:bg-orange-700 transition mt-4">ยืนยันการสมัคร</button></div>
                    </div>
                </div>
            )}
        </div>
    );
};

};


    
  // --- LOGIN SCREEN (New Design: Blue Curve & Gradient) ---
  const LoginScreen = ({ onLogin }) => {
    const [activeTab, setActiveTab] = useState('student'); // 'student' | 'teacher'
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [showPassword, setShowPassword] = useState(false);
    const [isLoading, setIsLoading] = useState(false);
    
    // State สำหรับค้นหาครู
    const [teacherList, setTeacherList] = useState([]);
    const [searchTeacher, setSearchTeacher] = useState('');
    const [showDropdown, setShowDropdown] = useState(false);

    // โหลดรายชื่อครู
    useEffect(() => {
      runServerFunction('getTeacherListForLogin')
        .then(res => setTeacherList(res))
        .catch(err => console.error(err));
    }, []);

    // Reset ค่าเมื่อเปลี่ยน Tab
    const handleTabChange = (tab) => {
      setActiveTab(tab);
      setUsername('');
      setPassword('');
      setSearchTeacher('');
      setShowDropdown(false);
    };

    const handleLogin = async (e) => {
      e.preventDefault();
      if (!username || !password) {
        Swal.fire('แจ้งเตือน', 'กรุณากรอกข้อมูลให้ครบถ้วน', 'warning');
        return;
      }
      setIsLoading(true);
      try {
        const result = await api.login(username, password);
        if (result.success) {
          Swal.fire({ 
            icon: 'success', 
            title: 'ยินดีต้อนรับ', 
            text: `สวัสดี ${result.user.firstname || result.user.username}`, 
            timer: 1500, 
            showConfirmButton: false 
          });
          onLogin(result.user);
        } else {
          Swal.fire('เข้าสู่ระบบไม่สำเร็จ', result.message, 'error');
        }
      } catch (error) {
        Swal.fire('Error', error.toString(), 'error');
      }
      setIsLoading(false);
    };

    // Filter ครู
    const filteredTeachers = teacherList.filter(t => 
      t.name.toLowerCase().includes(searchTeacher.toLowerCase())
    );

    return (
      <div className="relative flex flex-col items-center justify-center min-h-screen w-full bg-slate-50 font-sarabun overflow-hidden p-6">
        
        {/* --- Background Decoration (Blue Gradient Curve) --- */}
        <div className="absolute top-0 left-0 w-full h-[50vh] bg-gradient-to-br from-blue-700 via-blue-800 to-indigo-900 rounded-b-[60px] shadow-2xl z-0"></div>

        {/* --- Main Card --- */}
        <div className="w-full max-w-sm bg-white/95 backdrop-blur-md p-8 rounded-[32px] shadow-[0_20px_50px_rgba(0,0,0,0.15)] border border-white/50 relative z-10 animate-fadeIn mt-10">
          
          {/* Logo Section */}
          <div className="text-center mb-8">
             <div className="w-64 h-32 mx-auto mb-2 overflow-hidden flex items-center justify-center">
                {/* Scale 1.35 เพื่อ Crop บนล่างออกนิดหน่อยตามที่เคยขอไว้ */}
                <img src="https://lh3.googleusercontent.com/d/1S6tp83tQfJoffLMT-3vQLoVFHKp3QNHp" alt="Logo" className="w-full object-contain scale-[1.00]" />
             </div>
          </div>

          {/* Tab Switcher */}
          <div className="flex bg-slate-200 p-1.5 rounded-2xl mb-6">
            <button 
              type="button"
              onClick={() => handleTabChange('student')}
              className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'student' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-slate-400 hover:text-slate-600'}`}
            >
              <Icons.User size={18} /> นักเรียน
            </button>
            <button 
              type="button"
              onClick={() => handleTabChange('teacher')}
              className={`flex-1 flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'teacher' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-slate-400 hover:text-slate-600'}`}
            >
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10v6"/><path d="M20 16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2"/><rect x="4" y="2" width="16" height="8" rx="2"/><path d="M6 20v2"/><path d="M18 20v2"/></svg>
              คุณครู
            </button>
          </div>

          <form onSubmit={handleLogin} className="space-y-5">
            
            {/* Input 1: Username / Teacher Select */}
            <div className="relative group">
                <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors z-10">
                   {activeTab === 'student' ? <Icons.User size={22} /> : <Icons.Search size={22} />}
                </div>

                {activeTab === 'student' ? (
                   <input 
                      type="text" 
                      value={username}
                      onChange={(e) => setUsername(e.target.value)}
                      placeholder="รหัสประจำตัวนักเรียน" 
                      className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all placeholder:text-slate-400" 
                   />
                ) : (
                   <>
                      <input 
                        type="text" 
                        value={searchTeacher}
                        onChange={(e) => {
                          setSearchTeacher(e.target.value);
                          setUsername(''); 
                          setShowDropdown(true);
                        }}
                        onFocus={() => setShowDropdown(true)}
                        placeholder="ค้นหาชื่อคุณครู..." 
                        className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all placeholder:text-slate-400" 
                      />
                      
                      {/* Dropdown */}
                      {showDropdown && (
                        <div className="absolute top-full left-0 right-0 mt-2 bg-white border border-slate-100 rounded-xl shadow-xl max-h-48 overflow-y-auto z-30 animate-slideDown">
                           {filteredTeachers.length > 0 ? (
                              filteredTeachers.map((t) => (
                                <div 
                                  key={t.username}
                                  onClick={() => {
                                    setUsername(t.username); 
                                    setSearchTeacher(t.name); 
                                    setShowDropdown(false);
                                  }}
                                  className="px-4 py-3 hover:bg-blue-50 cursor-pointer text-sm text-slate-600 border-b border-slate-50 last:border-0 flex items-center gap-2 transition-colors"
                                >
                                  <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">
                                    {t.name.charAt(0)}
                                  </div>
                                  {t.name}
                                </div>
                              ))
                           ) : (
                              <div className="px-4 py-3 text-sm text-slate-400 text-center">ไม่พบรายชื่อ</div>
                           )}
                        </div>
                      )}
                      {/* Backdrop for dropdown */}
                      {showDropdown && <div className="fixed inset-0 z-20" onClick={() => setShowDropdown(false)}></div>}
                   </>
                )}
            </div>

            {/* Input 2: Password */}
            <div className="relative group">
              <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors">
                <Icons.Lock size={22} />
              </div>
              <input 
                type={showPassword ? "text" : "password"} 
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="รหัสผ่าน" 
                className="w-full pl-12 pr-12 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all placeholder:text-slate-400" 
              />
              <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
                {showPassword ? <Icons.EyeOff size={22} /> : <Icons.Eye size={22} />}
              </button>
            </div>

            {/* Login Button */}
            <button 
              type="submit" 
              disabled={isLoading}
              className="w-full py-4 mt-2 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white rounded-2xl font-bold shadow-xl shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 text-lg tracking-wide border border-white/10"
            >
              {isLoading ? <Icons.Loader2 className="spin" size={24} /> : "เข้าสู่ระบบ"}
            </button>

          </form>

          {/* Footer */}
          <div className="mt-8 text-center opacity-80 hover:opacity-100 transition-opacity">
             <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Copyright © 2026 PCSHS-PHET</p>
             <p className="text-[9px] text-blue-500 font-bold mt-1 uppercase tracking-widest">KITTIPAT ROTJANAI</p>
          </div>

        </div>
      </div>
    );
  };

    // --- Component: แจ้งเตือนให้ติดตั้งแอป ---
const InstallPrompt = () => {
  const [show, setShow] = useState(false);
  const [os, setOs] = useState(''); // 'ios', 'android', 'desktop'

  useEffect(() => {
    // 1. เช็คว่าเป็น Standalone (App) แล้วหรือยัง?
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    
    if (!isStandalone) {
      // 2. ถ้ายังไม่ใช่ App ให้เช็ค OS
      const ua = navigator.userAgent.toLowerCase();
      // เช็คว่าเป็น Mobile หรือไม่
      const isMobile = /iphone|ipad|ipod|android/.test(ua);
      
      if (isMobile) {
          if (ua.includes('iphone') || ua.includes('ipad') || ua.includes('ipod')) {
             setOs('ios');
             // หน่วงเวลาเล็กน้อยก่อนแสดง เพื่อให้ App โหลดเสร็จก่อน
             setTimeout(() => setShow(true), 2000);
          } else if (ua.includes('android')) {
             setOs('android');
             setTimeout(() => setShow(true), 2000);
          }
      }
    }
  }, []);

  if (!show) return null;

  return (
    <div className="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.15)] z-[9999] p-4 border-t border-slate-100 animate-fadeIn safe-area-bottom">
       <div className="max-w-md mx-auto relative">
          <button onClick={() => setShow(false)} className="absolute -top-2 -right-2 p-2 text-slate-400 hover:text-slate-600 bg-white rounded-full shadow-sm border border-slate-100">
            <Icons.Close size={20} />
          </button>
          
          <div className="flex items-start gap-4">
             <div className="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center text-emerald-600 shrink-0">
                <Icons.PlusSquare size={28} />
             </div>
             <div className="flex-1">
                <h3 className="font-bold text-slate-800 text-sm mb-1">ติดตั้งแอปเพื่อใช้งานเต็มจอ</h3>
                <p className="text-xs text-slate-500 mb-3">เพิ่มลงในหน้าจอโฮมเพื่อประสบการณ์การใช้งานที่ดีที่สุด</p>
                
                {os === 'ios' && (
                   <div className="bg-slate-50 p-3 rounded-lg text-xs text-slate-600 flex flex-col gap-2 border border-slate-100">
                      <div className="flex items-center gap-2">1. กดปุ่มแชร์ <span className="text-blue-500"><Icons.ShareIOS /></span> ที่แถบเมนู</div>
                      <div className="flex items-center gap-2">2. เลือกเมนู <span className="font-bold bg-gray-200 px-1 rounded text-[10px]">เพิ่มไปยังหน้าจอโฮม</span></div>
                   </div>
                )}

                {os === 'android' && (
                   <div className="bg-slate-50 p-3 rounded-lg text-xs text-slate-600 flex flex-col gap-2 border border-slate-100">
                      <div className="flex items-center gap-2">1. กดปุ่มเมนู <span className="text-slate-500"><Icons.MenuAndroid /></span> มุมขวาบน</div>
                      <div className="flex items-center gap-2">2. เลือก <span className="font-bold">"เพิ่มลงในหน้าจอหลัก"</span></div>
                   </div>
                )}
             </div>
          </div>
       </div>
    </div>
  );
};

const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [user, setUser] = useState(null);

      const handleLoginSuccess = (userData) => {
        setUser(userData);
        setIsLoggedIn(true);
      };

      const handleLogout = () => {
          setIsLoggedIn(false);
          setUser(null);
      };

      // --- ส่วนที่แก้ไข (หน้า Login) ---
      if (!isLoggedIn) {
          return (
            // ลบ wrapper ที่จำกัดความกว้าง (max-w-md) ออก
            // และส่งให้ LoginScreen จัดการ Layout ของตัวเองเต็มๆ
            <div className="font-sans antialiased text-gray-900">
                <LoginScreen onLogin={handleLoginSuccess} />
            </div>
          );
      }

      // --- ส่วนที่คงเดิม (หน้า Dashboard) ---
      return (
        <div className="h-screen w-full bg-gray-100 flex justify-center items-center font-sans antialiased text-gray-900 overflow-hidden">

        <InstallPrompt />
          {/* Dashboard ยังคงจำกัดความกว้างไว้ที่ max-w-5xl ตามที่เราแก้ไปก่อนหน้า เพื่อความสวยงาม */}
          <div className="w-full md:max-w-5xl h-full bg-white md:shadow-2xl overflow-hidden relative flex flex-col transition-all duration-300">
            {user.role === 'admin' ? (
                <AdminDashboard user={user} onLogout={handleLogout} />
            ) : user.role === 'teacher' ? (
                <TeacherDashboard user={user} onLogout={handleLogout} />
            ) : (
                <StudentView user={user} onLogout={handleLogout} />
            )}
          </div>
        </div>
      );
    };

    

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    
  </script>
